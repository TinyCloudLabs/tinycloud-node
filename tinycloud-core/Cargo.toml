[package]
name = "tinycloud-core"
version = "1.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["sqlite", "postgres", "mysql", "tokio"]

sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
duckdb = ["dep:arrow", "dep:duckdb"]
# TC-409: opt-in, deterministic verification-count test hook
# (`admission::test_hook`). Off by default; never part of a production
# build. Downstream crates enable it only on their `tinycloud-core`
# dev-dependency so their own tests can assert exactly-once verification.
verification-count-test-hook = []
# TC-887: `at_rest::FixedKeyProvider`, a deterministic test key provider.
# Never part of a production build; downstream crates enable it only on their
# `tinycloud-core` dev-dependency.
test-util = []

tokio = [
    "sea-orm/runtime-tokio-rustls",
    "sea-orm-migration/runtime-tokio-rustls",
]
async-std = [
    "sea-orm/runtime-async-std-rustls",
    "sea-orm-migration/runtime-async-std-rustls",
]

[dependencies]
dashmap = "5.5"
async-trait.workspace = true
sea-orm = { version = "1.1", default-features = false, features = ["macros", "with-time", "with-json", "postgres-array"] }
sea-orm-migration = { version = "1.1", default-features = false }
futures.workspace = true
pin-project.workspace = true
time.workspace = true
tinycloud-auth = { version = "1.0", path = "../tinycloud-auth" }
libp2p = { version = "0.52.1", default-features = false, features = ["ed25519"] }
thiserror.workspace = true
serde.workspace = true
chacha20poly1305 = { version = "0.10", features = ["std"] }
serde_json.workspace = true
serde_ipld_dagcbor = "0.3"
ucan-capabilities-object.workspace = true
multihash-derive = "0.9"
rusqlite.workspace = true
sqlparser.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
duckdb = { version = "1.1", features = ["bundled", "appender-arrow"], optional = true }
arrow = { version = "56", features = ["ipc"], optional = true }
tempfile = "3"
# TC-887: `zeroize` wipes the AES key schedule on drop; `aes` is listed only to
# enable its `zeroize` feature (feature unification). Not wiped (accepted
# residual): the GHASH key H (polyval 0.6.2's autodetect backend keeps it in a
# ManuallyDrop union with no Drop), the hkdf PRK and the hmac state.
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hex.workspace = true
base64.workspace = true
sha2 = "0.10"
sqlx-core = "=0.8.6"
uuid = "1"
sha3 = "0.10"
k256 = "0.13"
# TC-887: at-rest envelope key derivation and object names; zeroize key
# material on drop.
hkdf = "0.12"
hmac = "0.12"
zeroize = "1"
prometheus = { version = "0.13.0", features = ["process"] }
ryu-js = "0.2.2"
# W1 (audit P1): full Unicode NFC normalization for policy capability path
# canonicalization. Replaces the hand-coded subset that only composed a
# narrow Latin precomposed-pair table.
unicode-normalization = "0.1"

[dev-dependencies]
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
async-std = { version = "1", features = ["attributes"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = "0.3"
iri-string.workspace = true
proptest = "1"
