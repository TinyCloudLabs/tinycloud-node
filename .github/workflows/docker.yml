              except OSError:
                  raise SystemExit('::error::Reviewed deployment artifact is unavailable') from None

          def git(*args):
              result = subprocess.run(['git', *args], capture_output=True, text=True)
              return result.stdout if result.returncode == 0 else ''

          path = Path('docker-compose.dstack-postgres.yaml')
          if path.is_symlink() or path.resolve() != Path.cwd().resolve() / path:
              raise SystemExit('::error::Deployment destination is not the fixed reviewed path')
          native = 'ghcr.io/tinycloudlabs/tinycloud-node'
          reviewed = native + '@sha256:4bdae4fc232d886bb56bfbce4ec62ed4b8fb4e1369a01f6afb73d06dd68c188f'
          # TC-959: main's N0 compose (#349 c33c2302…) with the 95m ingress body
          # cap (raw d95bfb70…), the TC-1274 + TC-1317 + TC-1482 + c_index Vector config and the
          # optional TC-1482 NODE_STATS_READ_TOKEN env line and the TC-950 pool of 10 (raw 99013c40…),
          # its single node digest normalized to 64 zeros.
          n0_template_hash = 'c91e5b7aabd141faf48b206e398474f8d90cde926c2bfe3f1a163b4923605093'
          node_pin = re.compile(rb'(?m)^    image: ghcr\.io/tinycloudlabs/tinycloud-node@sha256:([0-9a-f]{64})$')
          def n0_template(raw):
              pins = list(node_pin.finditer(raw))
              if len(pins) != 1:
