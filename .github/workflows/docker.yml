name: Docker Container

# TC-312: the release -> auto-deploy chain used to fire on the GitHub Release
# `published` event; it no longer does. release-plz.toml sets
# `git_release_enable = false`, so release-plz only pushes the `vX.Y.Z` tag —
# the GitHub Release itself is created by cargo-dist (release.yml) with the
# default `GITHUB_TOKEN`. GitHub deliberately does NOT emit workflow-triggering
# events (including `release`) for actions taken with `GITHUB_TOKEN`, to prevent
# recursive runs, so `on: release` here never fires from a cargo-dist release
# and prod could only be deployed by a manual `workflow_dispatch`.
#
# Fix: trigger on the tag push itself. release-plz pushes tags with a PAT
# (RELEASE_PLZ_TOKEN) and a manual `git push --tags` also emits a normal `push`
# event, so tag pushes reliably reach this workflow. `on: release` is kept for
# backward compatibility should a PAT-published Release ever reappear.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rollback_audit_only:
        description: 'Read-only aggregate meeting rollback inventory; skips image builds and deployment'
        required: false
        type: boolean
        default: false
      include_duckdb:
        description: 'Build images with DuckDB support enabled'
        required: false
        type: boolean
        default: false
      include_tc_bench_v1:
        description: 'Build images with the tc-bench-v1 endpoints enabled'
        required: false
        type: boolean
        default: false
      deploy_phala:
        description: 'Deploy the dstack image to Phala after build'
        required: false
        type: boolean
        default: false
      authorize_quota_values:
        description: 'Fresh authorization of the reviewed quota values/authority for this deployment; required on every deploy_phala path.'
        required: false
        type: boolean
        default: false
      rollback_pre_n0:
        description: 'Deploy only the captured pre-N0 1.20.6 compose; requires an explicit Sam-approved rollback privacy mode.'
        required: false
        type: boolean
        default: false
      rollback_privacy_mode:
        description: 'Explicit rollback-only policy; stop-future-local-logs does NOT delete existing files. No production default.'
        required: false
        type: choice
        options: [unselected, keep-json-file, stop-future-local-logs]
        default: unselected
      allow_non_descendant:
        description: 'Skip the production ancestry guard for a deliberate non-descendant deployment'
        required: false
        type: boolean
        default: false
      sql_identity_fence:
        description: 'Keep SQL/DuckDB fenced in the Phala deploy (true until offline verification passes)'
        required: true
        type: boolean
        default: true
      image_version:
        description: 'Image version without leading v. Builds must match the selected crate; digest promotions must match the recorded image version (rollback_image_version when supplied).'
        required: false
        type: string
        default: ''
      deploy_image_digest:
        description: 'Promote an existing sha256 digest without rebuilding, dispatched on main only. Requires truthful image_version, deploy_phala and default dstack features.'
        required: false
        type: string
        default: ''
      rollback_image_version:
        description: 'Recorded immutable digest version label, for recovery, rollback or forward digest promotion; revision must be in main history'
        required: false
        type: string
        default: ''
      rollback_image_revision:
        description: 'Recorded digest 40-character revision label (must be an ancestor of main)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tinycloudlabs/tinycloud-node

jobs:
  rollback-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_audit_only
    runs-on: ubuntu-latest
    # TC-971: PROD_TINYCLOUD_DATABASE_URL lives in the production environment.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit durable meeting publication footprint without exporting data
        env:
          RECOVERY_DATABASE_URL: ${{ secrets.PROD_TINYCLOUD_DATABASE_URL }}
          # libpq needs the public CA bundle explicitly for verify-full;
          # production's Rust TLS client has compiled-in public roots.
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        run: python3 scripts/audit-meeting-rollback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meeting-rollback-audit
          path: meeting-rollback-audit.json
          if-no-files-found: ignore
  # TC-342: every image tag this workflow can produce must agree with the crate
  # version at the checked-out ref. `image_version` used to be unconstrained
  # free text, which is how an image got labelled 1.10.0 from a tree whose
  # Cargo.toml said 1.9.0 — prod then ran a binary that no tag in the repo
  # identified, and the team debugged a feature that was not in the deployed
  # image. Fail the whole workflow loudly instead of shipping a mislabelled tag.
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.check.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check published Docker tags
        run: python3 scripts/ci/test-docker-tags.py

      - name: Test quota authority with synthetic HTTP
        run: python3 scripts/ci/test-quota-authority.py
      - name: Test recovery deployment boundaries and documented commands
        run: python3 scripts/ci/test-deploy-recovery.py

      - name: Validate image version against Cargo.toml
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_VERSION: ${{ inputs.image_version }}
          INPUT_DEPLOY_DIGEST: ${{ inputs.deploy_image_digest }}
          INPUT_DEPLOY_PHALA: ${{ inputs.deploy_phala }}
          AUTHORIZE_QUOTA_VALUES: ${{ inputs.authorize_quota_values }}
          ROLLBACK_PRE_N0: ${{ inputs.rollback_pre_n0 }}
          ROLLBACK_PRIVACY_MODE: ${{ inputs.rollback_privacy_mode }}
          APPROVED_ROLLBACK_PRIVACY_MODE: ${{ vars.TC959_ROLLBACK_PRIVACY_MODE }}
          ROLLBACK_VERSION: ${{ inputs.rollback_image_version }}
          ROLLBACK_REVISION: ${{ inputs.rollback_image_revision }}
          INCLUDE_DUCKDB: ${{ inputs.include_duckdb }}
          INCLUDE_TC_BENCH_V1: ${{ inputs.include_tc_bench_v1 }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # #310 and this recovery change must land as one lineage, before
          # #309's later logging window. Never merge #310 alone.
          if [ "${INPUT_DEPLOY_PHALA}" = "true" ]; then
            if [ "${EVENT_NAME}" != "workflow_dispatch" ] || [ "${AUTHORIZE_QUOTA_VALUES:-false}" != "true" ]; then
              echo "::error::Every deployment requires explicit authorize_quota_values=true before any mutation"
              exit 1
            fi
          fi
          python3 scripts/ci/reconcile-quota.py --validate-only

          # `|| true` so a missing match reaches the explicit check below
          # instead of dying under `set -e` with no explanation.
          CARGO_VERSION="$(grep -m1 -E '^version = "' tinycloud-node-server/Cargo.toml | cut -d '"' -f 2 || true)"
          if [ -z "${CARGO_VERSION}" ]; then
            echo "::error::could not read the tinycloud-node version from tinycloud-node-server/Cargo.toml"
            exit 1
          fi
          if [ "${ROLLBACK_PRE_N0:-false}" = "true" ]; then
            if [ "${EVENT_NAME}" != "workflow_dispatch" ] || [ "${GITHUB_REF}" != "refs/heads/main" ] \
              || [ "${INPUT_DEPLOY_PHALA}" != "true" ] \
              || [ "${INPUT_DEPLOY_DIGEST}" != "sha256:4bdae4fc232d886bb56bfbce4ec62ed4b8fb4e1369a01f6afb73d06dd68c188f" ] \
              || [ "${INPUT_IMAGE_VERSION}" != "1.20.6" ] || [ "${ROLLBACK_VERSION}" != "1.20.6" ] \
              || [ "${ROLLBACK_REVISION}" != "e18578ff9162986ddd813259c60f73866e3e60d1" ]; then
              echo "::error::Captured pre-N0 rollback requires main-only dispatch and the exact recorded 1.20.6 digest labels"
              exit 1
            fi
            case "${ROLLBACK_PRIVACY_MODE:-unselected}" in
              keep-json-file|stop-future-local-logs) ;;
              *) echo "::error::Choose an explicit Sam-approved rollback privacy mode"; exit 1 ;;
            esac
            if [ "${APPROVED_ROLLBACK_PRIVACY_MODE:-}" != "${ROLLBACK_PRIVACY_MODE}" ]; then
              echo "::error::Rollback privacy mode does not match the recorded Sam card decision"
              exit 1
            fi
          elif [ "${ROLLBACK_PRIVACY_MODE:-unselected}" != "unselected" ]; then
            echo "::error::Rollback privacy selection is mutually exclusive from current-compose promotion"
            exit 1
          fi

          check_matches() {
            label="$1"
            value="$2"
            if [ "${value#v}" != "${CARGO_VERSION}" ]; then
              echo "::error::${label} is '${value}' but tinycloud-node-server/Cargo.toml at this ref says '${CARGO_VERSION}'. Image tags must match the crate version — bump Cargo.toml via the release-plz release PR first (see docs/releasing.md)."
              exit 1
            fi
            echo "${label} '${value}' matches the crate version."
          }

          if [ "${EVENT_NAME}" = "release" ]; then
            check_matches "release tag" "${RELEASE_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            check_matches "git tag" "${GITHUB_REF_NAME}"
          fi

          # TC-940: every production revision is in main's history, so a
          # rollback dispatched on main passes the ancestry guard without
          # allow_non_descendant. The rollback revision itself must be an
          # ancestor of main (checked by scripts/ci/check-deploy-ref.sh).
          if [ -n "${ROLLBACK_VERSION}" ] || [ -n "${ROLLBACK_REVISION}" ]; then
            if [ -z "${INPUT_DEPLOY_DIGEST}" ] \
              || ! [[ "${ROLLBACK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || ! [[ "${ROLLBACK_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Rollback label override requires a digest and valid version/revision labels"
              exit 1
            fi
            echo "::notice::Using recorded image labels: ${ROLLBACK_VERSION} revision ${ROLLBACK_REVISION}"
          fi
          if [ -n "${INPUT_IMAGE_VERSION}" ]; then
            if [ -n "${INPUT_DEPLOY_DIGEST}" ] && [ -n "${ROLLBACK_VERSION}" ]; then
              if [ "${INPUT_IMAGE_VERSION}" != "${ROLLBACK_VERSION}" ]; then
                echo "::error::Digest promotion image_version must equal the recorded image version"
                exit 1
              fi
            else
              check_matches "image_version input" "${INPUT_IMAGE_VERSION}"
            fi
          fi
          if [ -n "${INPUT_DEPLOY_DIGEST}" ]; then
            if [ "${EVENT_NAME}" != "workflow_dispatch" ] || [ "${GITHUB_REF}" != "refs/heads/main" ] \
              || [ "${INPUT_DEPLOY_PHALA}" != "true" ] || [ -z "${INPUT_IMAGE_VERSION}" ] \
              || [ "${INCLUDE_DUCKDB}" = "true" ] || [ "${INCLUDE_TC_BENCH_V1}" = "true" ] \
              || ! [[ "${INPUT_DEPLOY_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Digest promotion requires workflow_dispatch on main, deploy_phala=true, truthful image_version, default dstack features and a sha256 digest."
              exit 1
            fi
          fi
          # Only the version of the selected binary enters deployment
          # outputs/logs; the workflow checkout is not the promoted image.
          SELECTED_VERSION="${ROLLBACK_VERSION:-${CARGO_VERSION}}"
          echo "image_version=${SELECTED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Selected image version: ${SELECTED_VERSION}"

      # TC-940: refuse a production deploy from anything but main or a vX.Y.Z
      # tag on main's history before spending time on image builds. The
      # deploy-phala job repeats this check next to the secrets.
      - name: Guard main-only deploy source
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_phala
        env:
          ROLLBACK_REVISION: ${{ inputs.rollback_image_revision }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          bash scripts/ci/check-deploy-ref.sh

  build:
    runs-on: ubuntu-latest
    needs: [version-guard]
    if: vars.TC780_CUTOVER_READY == 'true' && inputs.deploy_image_digest == '' && !inputs.rollback_audit_only
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve optional build features
        id: build_features
        run: |
          FEATURES=""
          IMAGE_SUFFIX=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_duckdb }}" = "true" ]; then
            FEATURES="duckdb"
            IMAGE_SUFFIX="-duckdb"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_tc_bench_v1 }}" = "true" ]; then
            FEATURES="${FEATURES:+$FEATURES }tc-bench-v1"
            IMAGE_SUFFIX="${IMAGE_SUFFIX}-tc-bench-v1"
          fi
          {
            echo "cargo_features=${FEATURES}"
            echo "image_suffix=${IMAGE_SUFFIX}"
            echo "manual_version=${{ inputs.image_version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}},suffix=${{ steps.build_features.outputs.image_suffix }}
            type=raw,value=${{ steps.build_features.outputs.manual_version }}${{ steps.build_features.outputs.image_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && steps.build_features.outputs.manual_version != '' }}
            type=sha,prefix=
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ vars.TC780_CUTOVER_READY == 'true' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CARGO_FEATURES=${{ steps.build_features.outputs.cargo_features }}
          cache-from: type=gha,scope=node
          cache-to: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'type=gha,mode=max,scope=node' || '' }}

  build-dstack:
    runs-on: ubuntu-latest
    needs: [version-guard]
    if: vars.TC780_CUTOVER_READY == 'true' && inputs.deploy_image_digest == '' && !inputs.rollback_audit_only && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve optional build features
        id: build_features
        run: |
          FEATURES="dstack"
          IMAGE_SUFFIX=""
          SHA_PREFIX="dstack-"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_duckdb }}" = "true" ]; then
            FEATURES="dstack duckdb"
            IMAGE_SUFFIX="-duckdb"
            SHA_PREFIX="dstack-duckdb-"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_tc_bench_v1 }}" = "true" ]; then
            FEATURES="$FEATURES tc-bench-v1"
            IMAGE_SUFFIX="${IMAGE_SUFFIX}-tc-bench-v1"
            SHA_PREFIX="${SHA_PREFIX}tc-bench-v1-"
          fi
          {
            echo "cargo_features=${FEATURES}"
            echo "image_suffix=${IMAGE_SUFFIX}"
            echo "sha_prefix=${SHA_PREFIX}"
            echo "manual_version=${{ inputs.image_version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-dstack${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=-dstack${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}},suffix=-dstack${{ steps.build_features.outputs.image_suffix }}
            type=raw,value=${{ steps.build_features.outputs.manual_version }}-dstack${{ steps.build_features.outputs.image_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && steps.build_features.outputs.manual_version != '' }}
            type=sha,prefix=${{ steps.build_features.outputs.sha_prefix }}
            type=raw,value=dstack-main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=dstack-edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=dstack,enable=${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push dstack Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CARGO_FEATURES=${{ steps.build_features.outputs.cargo_features }}
          cache-from: type=gha,scope=dstack
          cache-to: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'type=gha,mode=max,scope=dstack' || '' }}

  build-ingress:
    name: Build dstack ingress image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (vars.TC780_CUTOVER_READY == 'true' && inputs.deploy_image_digest == '' && !inputs.rollback_audit_only && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # TC-970: no ticket, identifier or client address in the ingress logs;
      # TC-910 header buffers and the 95 MiB body limit still hold. Runs before
      # the push so a failing wrapper is never published.
      - name: Test redacted ingress logging
        run: deploy/ingress/test-redacted-logging.sh

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/tinycloudlabs/tinycloud-node-ingress
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ingress image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: deploy/ingress
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ingress
          cache-to: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'type=gha,mode=max,scope=ingress' || '' }}
      - name: Record ingress image digest
        if: steps.build.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/tinycloudlabs/tinycloud-node-ingress@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
  deploy-phala:
    runs-on: ubuntu-latest
    needs: [version-guard, build, build-dstack]
    # TC-971: production-environment policy admits main and v* tags. Most deploy
    # secrets live there; PROD_TINYCLOUD_ADMIN_SECRET is repository-scoped.
    # Digest promotion additionally requires main, not a release tag.
    environment: production
    if: >-
      ${{ vars.TC780_CUTOVER_READY == 'true' && !cancelled() && !inputs.rollback_audit_only && needs.version-guard.result == 'success' &&
        github.event_name == 'workflow_dispatch' && inputs.deploy_phala &&
        ((inputs.deploy_image_digest != '' && github.ref == 'refs/heads/main' && needs.build.result == 'skipped' && needs.build-dstack.result == 'skipped') ||
          (inputs.deploy_image_digest == '' && needs.build.result == 'success' && needs.build-dstack.result == 'success')) }}
    outputs:
      image: ${{ steps.pin.outputs.image }}
      version: ${{ steps.pin.outputs.version }}
      revision: ${{ steps.pin.outputs.revision }}
      image_label: ${{ steps.pin.outputs.image_label }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TC-940: production is built and promoted only from main. Refuse any
      # other dispatched ref before this job touches a deploy secret.
      - name: Guard main-only deploy source
        env:
          ROLLBACK_REVISION: ${{ inputs.rollback_image_revision }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          bash scripts/ci/check-deploy-ref.sh

      - name: Log in to GHCR for digest validation
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned deliberately. phala 1.1.20 (published 2026-07-26) fails against
      # the existing centralized-KMS prod CVM with "CVM encrypted_env_pubkey is
      # required for centralized KMS", which broke the 2026-07-28 deploy. The
      # last green deploy (run 29953848846, 2026-07-22) ran on 1.1.19. Only
      # unpin once the prod CVM is migrated or 1.1.20+ is verified against it.
      - name: Install Phala CLI
        run: npm install -g phala@1.1.19

      - name: Install Phala env synchronization SDK
        # Same SDK generation as phala 1.1.19, isolated from the checkout.
        # Install before any sealed values enter the step environment.
        run: npm install --prefix "$RUNNER_TEMP/phala-env-sync" --no-save --ignore-scripts @phala/cloud@0.2.9

      - name: Guard production ancestry
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          ALLOW_NON_DESCENDANT: ${{ inputs.allow_non_descendant }}
        run: |
          set -euo pipefail

          if [ "${ALLOW_NON_DESCENDANT}" = "true" ]; then
            echo "::warning::allow_non_descendant=true; skipping the production revision ancestry check"
            exit 0
          fi

          if ! CVM_JSON="$(mktemp)"; then
            echo "::error::Cannot create a temporary file for Phala's current compose"
            exit 1
          fi
          trap 'rm -f "${CVM_JSON}"' EXIT
          if ! phala cvms get tinycloud-node --json >"${CVM_JSON}" 2>/dev/null; then
            echo "::error::Cannot determine the running production revision from Phala"
            exit 1
          fi

          if ! RUNNING_IMAGE="$(python3 - "${CVM_JSON}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          try:
              response = json.loads(Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              sys.exit(0)

          if isinstance(response, str):
              compose = response
          elif isinstance(response, dict):
              compose_file = response.get("compose_file")
              if isinstance(compose_file, dict):
                  compose = compose_file.get("docker_compose_file", "")
              else:
                  compose = response.get("docker_compose_file", "")
          else:
              compose = ""
          if not isinstance(compose, str):
              sys.exit(0)

          images = re.findall(
              r"(?m)^\s*image:\s*['\"]?(ghcr\.io/tinycloudlabs/tinycloud-node@sha256:[0-9a-f]{64})",
              compose,
