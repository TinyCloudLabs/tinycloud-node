          # admin value (billing TINYCLOUD_ADMIN_SECRET); see docs/releasing.md.
          QUOTA_BILLING_ADMIN_SECRET: ${{ secrets.PROD_TINYCLOUD_ADMIN_SECRET }}
          QUOTA_BILLING_URL: ${{ secrets.PROD_TINYCLOUD_QUOTA_URL }}
        run: |
          set -euo pipefail
          set +x
          python3 scripts/ci/reconcile-quota.py --preflight

      - name: Validate and pin deployment image
