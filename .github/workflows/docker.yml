            "${RESOLVED_IMAGE}" "${VERSION}" "${REVISION}" >> "$GITHUB_STEP_SUMMARY"

      # TC-500: Phala considers a CVM ready before compose services have
      # started. Validate the production-sealed bundle using the exact image
      # selected above against the production database/TLS/key configuration,
      # without opening a database, resolving dstack, network, or socket
      # access, before the deploy step can replace the healthy CVM.
      - name: Preflight sealed runtime configuration
        env:
          TINYCLOUD_STORAGE__DATABASE: ${{ secrets.PROD_TINYCLOUD_DATABASE_URL }}
          TINYCLOUD_DATABASE__WRITE_FENCE: ${{ inputs.sql_identity_fence }}
          TINYCLOUD_SHARE_EMAIL__TRUST_BUNDLE_BASE64: ${{ secrets.PROD_TINYCLOUD_SHARE_TRUST_BUNDLE_BASE64 }}
          TINYCLOUD_SHARE_EMAIL__POSTGRES_TLS__SSLMODE: verify-full
          TINYCLOUD_KEYS__TYPE: Dstack
        run: |
          set -euo pipefail
          IMAGE="$(sed -n -E 's/^    image: (ghcr.io\/tinycloudlabs\/tinycloud-node(:[^[:space:]]+|@sha256:[0-9a-f]{64}))$/\1/p' docker-compose.dstack-postgres.yaml)"
          if [ "$(printf '%s\n' "${IMAGE}" | awk 'NF { count += 1 } END { print count + 0 }')" != "1" ]; then
            echo "::error::Expected exactly one resolved TinyCloud Node image for runtime preflight"
            exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e TINYCLOUD_STORAGE__DATABASE \
            -e TINYCLOUD_DATABASE__WRITE_FENCE \
            -e TINYCLOUD_SHARE_EMAIL__ENABLED=true \
            -e TINYCLOUD_SHARE_EMAIL__TRUST_BUNDLE_BASE64 \
            -e TINYCLOUD_SHARE_EMAIL__POSTGRES_TLS__SSLMODE \
            -e TINYCLOUD_KEYS__TYPE \
            "${IMAGE}" --validate-config

      # TC-959: only env_keys/encrypted_env may change here. Never copy the
      # precedent's raw-response logs or its unguarded compose_hash retry.
      # https://docs.phala.com/phala-cloud/references/cloud-js-sdk/update-cvm-envs
      - name: Prepare allowed_envs synchronization
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/phala-env-sync/sync.mjs" <<'JS'
          import { readFileSync } from "node:fs";
          import { setTimeout as sleep } from "node:timers/promises";

          // SDK DEBUG can print request bodies and server-supplied errors.
          delete process.env.DEBUG;
          let phase = "sealed env validation";
          const requireCondition = (condition) => {
            if (!condition) throw new Error("guard failed");
          };
          const validName = (name) => typeof name === "string" && /^[A-Za-z_][A-Za-z0-9_]*$/.test(name);
          const namesFrom = (compose) => {
            const names = compose?.allowed_envs;
            requireCondition(Array.isArray(names) && names.every(validName));
            requireCondition(new Set(names).size === names.length);
            return names;
          };

          try {
            const {
              createClient, getCvmComposeFile, getCvmInfo, updateCvmEnvs,
              encryptEnvVars, parseEnvVars,
            } = await import("@phala/cloud");
            requireCondition(Boolean(process.env.PHALA_CLOUD_API_KEY));
            const source = readFileSync(".phala-prod.env", "utf8");
            const envs = [];
            const keys = new Set();
            for (const line of source.split("\n")) {
              if (line === "") continue;
              const separator = line.indexOf("=");
              const key = line.slice(0, separator);
              const value = line.slice(separator + 1);
              requireCondition(separator > 0 && validName(key) && !keys.has(key));
              requireCondition(value.length > 0 && !/[\r\n]/.test(value));
              keys.add(key);
              envs.push({ key, value });
            }
            requireCondition(keys.has("BETTERSTACK_SOURCE_TOKEN"));
            // Match the CLI's dotenv interpretation exactly; no truncated,
            // quoted or comment-stripped value may replace the intended one.
            requireCondition(JSON.stringify(parseEnvVars(source)) === JSON.stringify(envs));
            const client = createClient({
              apiKey: process.env.PHALA_CLOUD_API_KEY,
              baseURL: "https://cloud-api.phala.com/api/v1",
              version: "2026-01-21",
              timeout: 15000,
              retry: 0,
            });
            const ref = { id: "tinycloud-node" };
            phase = "complete whitelist validation";
            const allowed = namesFrom(await getCvmComposeFile(client, ref));
            // Retaining a name cannot recover a value absent from this file.
            // Check before deploy AND again immediately before any env PATCH.
            requireCondition(allowed.every((key) => keys.has(key)));
            const missing = [...keys].filter((key) => !allowed.includes(key));
            if (process.argv.includes("--check")) {
              console.log(`Validated complete sealed set: ${keys.size} env names.`);
            } else if (missing.length === 0) {
              console.log(`allowed_envs verified: ${keys.size} env names; no PATCH needed.`);
            } else {
              phase = "public encryption key validation";
              const info = await getCvmInfo(client, ref);
              const pubkey = info.kms_info?.encrypted_env_pubkey ?? info.encrypted_env_pubkey;
              requireCondition(typeof pubkey === "string" && /^(0x)?[0-9a-fA-F]{64}$/.test(pubkey));
              const encrypted = await encryptEnvVars(envs, pubkey);
              phase = "env whitelist update";
              const result = await updateCvmEnvs(client, {
                ...ref, encrypted_env: encrypted, env_keys: [...allowed, ...missing],
              });
              // An on-chain precondition needs a separately reviewed
              // addComposeHash transaction. Never assume hash-only approval.
              requireCondition(result.status === "in_progress" && typeof result.correlation_id === "string" && result.correlation_id.length > 0);
              console.log(`allowed_envs update accepted: ${missing.length} added names.`);
              phase = "env whitelist convergence";
              const deadline = Date.now() + 600000;
              let completed = false;
              let observedOperation = false;
              const pending = new Set(["starting", "stopping", "stopped", "restarting", "upgrading", "updating", "creating"]);
              while (Date.now() < deadline) {
                await sleep(5000);
                const current = await getCvmInfo(client, ref);
                requireCondition(current.status === "running" || pending.has(current.status));
                const after = namesFrom(await getCvmComposeFile(client, ref));
                const progress = current.progress;
                // Prefer this operation's correlation. If optional progress
                // is absent, require a post-PATCH non-running/running cycle.
                if (progress?.correlation_id === result.correlation_id ||
                    (!progress?.correlation_id && pending.has(current.status))) observedOperation = true;
                // Missing/null progress can mean a fast or still-queued
                // restart. Stored names + running alone are not completion.
                const settled = progress == null || (
                  progress && !progress.target && !progress.started_at && !progress.correlation_id
                );
                if (observedOperation && current.status === "running" && settled && [...keys].every((key) => after.includes(key))) {
                  completed = true;
                  break;
                }
              }
              requireCondition(completed);
              console.log(`allowed_envs verified after update: ${keys.size} env names.`);
            }
          } catch {
            // Neither response message/JSON, ciphertext, nor exception detail
            // is safe for public Actions logs.
            console.error(`::error::allowed_envs synchronization failed during ${phase}; response details withheld.`);
            process.exitCode = 1;
          }
          JS

      - name: Deploy to Phala Cloud
        id: deploy
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_ENV_DATABASE_URL: ${{ secrets.PROD_TINYCLOUD_DATABASE_URL }}
          PHALA_ENV_S3_BUCKET: ${{ secrets.PROD_TINYCLOUD_S3_BUCKET }}
          PHALA_ENV_S3_ENDPOINT: ${{ secrets.PROD_TINYCLOUD_S3_ENDPOINT }}
          PHALA_ENV_AWS_KEY: ${{ secrets.PROD_TINYCLOUD_AWS_ACCESS_KEY_ID }}
          PHALA_ENV_AWS_SECRET: ${{ secrets.PROD_TINYCLOUD_AWS_SECRET_ACCESS_KEY }}
          PHALA_ENV_AWS_REGION: ${{ secrets.PROD_TINYCLOUD_AWS_REGION }}
          PHALA_ENV_TINYCLOUD_QUOTA_URL: ${{ secrets.PROD_TINYCLOUD_QUOTA_URL }}
          PHALA_ENV_TINYCLOUD_ADMIN_SECRET: ${{ secrets.PROD_TINYCLOUD_ADMIN_SECRET }}
          PHALA_ENV_NODE_STATS_READ_TOKEN: ${{ secrets.PROD_TINYCLOUD_NODE_STATS_READ_TOKEN }}
          PHALA_ENV_SHARE_TRUST_BUNDLE_BASE64: ${{ secrets.PROD_TINYCLOUD_SHARE_TRUST_BUNDLE_BASE64 }}
          PHALA_ENV_CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_TINYCLOUD_CLOUDFLARE_API_TOKEN }}
          PHALA_ENV_DSTACK_GATEWAY_DOMAIN: ${{ secrets.PROD_TINYCLOUD_DSTACK_GATEWAY_DOMAIN }}
          PHALA_ENV_CERTBOT_EMAIL: ${{ secrets.PROD_TINYCLOUD_CERTBOT_EMAIL }}
          PHALA_ENV_BETTERSTACK_SOURCE_TOKEN: ${{ secrets.PROD_TINYCLOUD_BETTERSTACK_SOURCE_TOKEN }}
          PHALA_ENV_SQL_IDENTITY_FENCE: ${{ inputs.sql_identity_fence }}
        # Update the existing prod CVM (name: tinycloud-node) in the
        # Tiny Cloud workspace. The PHALA_CLOUD_API_KEY secret is
        # workspace-scoped and must be issued from that workspace.
        run: |
          set -euo pipefail
          set +x
          umask 077
          trap 'rm -f .phala-prod.env' EXIT

          required_vars=(
            PHALA_CLOUD_API_KEY
            PHALA_ENV_DATABASE_URL
            PHALA_ENV_S3_BUCKET
            PHALA_ENV_S3_ENDPOINT
            PHALA_ENV_AWS_KEY
            PHALA_ENV_AWS_SECRET
            PHALA_ENV_AWS_REGION
            PHALA_ENV_TINYCLOUD_QUOTA_URL
            PHALA_ENV_TINYCLOUD_ADMIN_SECRET
            PHALA_ENV_SHARE_TRUST_BUNDLE_BASE64
            PHALA_ENV_CLOUDFLARE_API_TOKEN
            PHALA_ENV_DSTACK_GATEWAY_DOMAIN
            PHALA_ENV_CERTBOT_EMAIL
            PHALA_ENV_BETTERSTACK_SOURCE_TOKEN
            PHALA_ENV_SQL_IDENTITY_FENCE
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required GitHub secret for Phala deploy: ${var#PHALA_ENV_}"
              exit 1
            fi
            if [[ "${!var}" == *$'\n'* || "${!var}" == *$'\r'* ]]; then
              echo "::error::Phala deploy inputs must be single-line values"
              exit 1
            fi
          done

          # Optional (TC-1482): the same single-line rule, but absence is allowed.
          if [[ "${PHALA_ENV_NODE_STATS_READ_TOKEN:-}" == *$'\n'* || "${PHALA_ENV_NODE_STATS_READ_TOKEN:-}" == *$'\r'* ]]; then
            echo "::error::Phala deploy inputs must be single-line values"
            exit 1
          fi

          # TC-1482: the node keeps GET /admin/stats disabled (404) when the token
          # equals TINYCLOUD_ADMIN_SECRET or is shorter than 32 bytes (surrounding
          # whitespace ignored), which would surface only as an OpenKey 503. Refuse
          # both here, before anything is written, with constant messages; no value
          # is printed. `wc -c` counts bytes.
          if [ -n "${PHALA_ENV_NODE_STATS_READ_TOKEN:-}" ]; then
            if [ "$PHALA_ENV_NODE_STATS_READ_TOKEN" = "$PHALA_ENV_TINYCLOUD_ADMIN_SECRET" ]; then
              echo "::error::NODE_STATS_READ_TOKEN must differ from TINYCLOUD_ADMIN_SECRET"
              exit 1
            fi
            stats_token_trimmed="${PHALA_ENV_NODE_STATS_READ_TOKEN#"${PHALA_ENV_NODE_STATS_READ_TOKEN%%[![:space:]]*}"}"
            stats_token_trimmed="${stats_token_trimmed%"${stats_token_trimmed##*[![:space:]]}"}"
            if [ "$(printf '%s' "$stats_token_trimmed" | wc -c)" -lt 32 ]; then
              echo "::error::NODE_STATS_READ_TOKEN must be at least 32 bytes"
              exit 1
            fi
            unset stats_token_trimmed
          fi

          # Also restrict a file left by an earlier failed runner step before
          # writing any value; umask alone does not tighten an existing file.
          : > .phala-prod.env
          chmod 0600 .phala-prod.env
          {
            printf 'DATABASE_URL=%s\n' "$PHALA_ENV_DATABASE_URL"
            printf 'S3_BUCKET=%s\n' "$PHALA_ENV_S3_BUCKET"
            printf 'S3_ENDPOINT=%s\n' "$PHALA_ENV_S3_ENDPOINT"
            printf 'AWS_KEY=%s\n' "$PHALA_ENV_AWS_KEY"
            printf 'AWS_SECRET=%s\n' "$PHALA_ENV_AWS_SECRET"
            printf 'AWS_REGION=%s\n' "$PHALA_ENV_AWS_REGION"
            printf 'TINYCLOUD_QUOTA_URL=%s\n' "$PHALA_ENV_TINYCLOUD_QUOTA_URL"
            printf 'TINYCLOUD_ADMIN_SECRET=%s\n' "$PHALA_ENV_TINYCLOUD_ADMIN_SECRET"
            printf 'SHARE_TRUST_BUNDLE_BASE64=%s\n' "$PHALA_ENV_SHARE_TRUST_BUNDLE_BASE64"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PHALA_ENV_CLOUDFLARE_API_TOKEN"
            printf 'DSTACK_GATEWAY_DOMAIN=%s\n' "$PHALA_ENV_DSTACK_GATEWAY_DOMAIN"
            printf 'CERTBOT_EMAIL=%s\n' "$PHALA_ENV_CERTBOT_EMAIL"
            printf 'BETTERSTACK_SOURCE_TOKEN=%s\n' "$PHALA_ENV_BETTERSTACK_SOURCE_TOKEN"
            printf 'SQL_IDENTITY_FENCE=%s\n' "$PHALA_ENV_SQL_IDENTITY_FENCE"
            # TC-1482: optional. Unset keeps the node starting with
            # GET /admin/stats disabled (404); never written empty.
            if [ -n "${PHALA_ENV_NODE_STATS_READ_TOKEN:-}" ]; then
              printf 'NODE_STATS_READ_TOKEN=%s\n' "$PHALA_ENV_NODE_STATS_READ_TOKEN"
            fi
            # SSH public keys authorized on the CVM (checked into the repo,
            # see dstack-authorized-keys). The Phala Cloud pre-launch script
            # writes DSTACK_AUTHORIZED_KEYS to /home/root/.ssh/authorized_keys
            # at boot, enabling `phala ssh tinycloud-node`.
            printf 'DSTACK_AUTHORIZED_KEYS=%s\n' "$(cat dstack-authorized-keys)"
          } > .phala-prod.env

          # Validate complete env names/whitelist before any CVM mutation.
          node "$RUNNER_TEMP/phala-env-sync/sync.mjs" --check

          # Fail before replacing the running CVM if a required compose input
          # is absent. Phala's control-plane ready state does not prove that
          # docker compose interpolation or container startup succeeded.
          if ! docker compose --env-file .phala-prod.env \
            -f docker-compose.dstack-postgres.yaml config --quiet >/dev/null 2>&1; then
            echo "::error::Sealed compose validation failed; deployment not attempted"
            exit 1
          fi

          # The CLI/SDK can include request details in errors. Never forward
          # those responses into Actions logs, even when deployment fails.
          # A failing CLI/update can still have restarted the CVM.
          echo "cvm_mutation_attempted=true" >> "$GITHUB_OUTPUT"
          if ! phala deploy --cvm-id tinycloud-node -c docker-compose.dstack-postgres.yaml -e .phala-prod.env --no-public-logs --no-public-sysinfo --wait >/dev/null 2>&1; then
            echo "::error::Phala deployment failed; inspect the private control plane"
            exit 1
          fi

          # Do not assume -e registered the whitelist; verify/sync it explicitly.
          node "$RUNNER_TEMP/phala-env-sync/sync.mjs"

      - name: Remove sealed deployment environment
        if: always()
        run: rm -f .phala-prod.env

      # TC-312: prove the deploy actually converged. The image tag matching the
      # crate version is enforced at build time by version-guard, but nothing
      # previously confirmed the running CVM serves it — the incident where prod
      # reported a stale version went unnoticed for exactly this reason. Poll the
      # public /version endpoint and fail the job if it never reports the tag we
      # just deployed.
      - name: Verify deployed version
        env:
          EXPECTED: ${{ steps.pin.outputs.version }}
          IMAGE_REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          set -euo pipefail

          # Only validated image labels describe the binary, not Cargo.toml
          # at the workflow checkout when an existing digest is promoted.
          echo "Expecting node.tinycloud.xyz to report version ${EXPECTED} (revision ${IMAGE_REVISION})"

          # The CVM needs a short while to pull the new image and restart, so
          # retry with a fixed backoff (~5 min total) before giving up.
          ATTEMPTS=30
          SLEEP=10
          REPORTED=""
          for i in $(seq 1 "${ATTEMPTS}"); do
            REPORTED="$(curl -fsS --max-time 15 https://node.tinycloud.xyz/version | jq -r '.version' || true)"
            echo "attempt ${i}/${ATTEMPTS}: /version reported '${REPORTED}'"
            if [ "${REPORTED}" = "${EXPECTED}" ]; then
              echo "node.tinycloud.xyz is serving ${EXPECTED}."
              exit 0
            fi
            sleep "${SLEEP}"
          done

          echo "::error::node.tinycloud.xyz still reports '${REPORTED}' after $((ATTEMPTS * SLEEP))s, expected '${EXPECTED}'. The deploy did not converge."
          exit 1

      # Ingress TLS readiness is required health. Restore quotas before the
      # separate Policy probes, which still fail the deployment if invalid.
      - name: Verify deployed ingress health
        env:
          EXPECTED: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            REPORTED="$(curl -fsS --max-time 10 https://tee.node.tinycloud.xyz/version | jq -r '.version' || true)"
            if [ "${REPORTED}" = "${EXPECTED}" ]; then
              echo "Direct TEE ingress is serving ${EXPECTED}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Direct TEE ingress did not become healthy at version ${EXPECTED}."
          exit 1

      # General reviewed authority/values, freshly authorized for every deploy.
      # Same job, after the final env operation and required health, before
      # ancillary Policy probes. Billing mode is verification-only.

      - name: Restore storage quota overrides
        id: quotas
        timeout-minutes: 5
        if: ${{ success() && inputs.authorize_quota_values }}
        env:
          # Repository-scoped; never read by an agent or passed in argv.
          QUOTA_ADMIN_SECRET: ${{ secrets.PROD_TINYCLOUD_ADMIN_SECRET }}
          QUOTA_BILLING_ADMIN_SECRET: ${{ secrets.PROD_TINYCLOUD_ADMIN_SECRET }}
          QUOTA_BILLING_URL: ${{ secrets.PROD_TINYCLOUD_QUOTA_URL }}
        run: |
          set -euo pipefail
          set +x
          python3 scripts/ci/reconcile-quota.py

      # TC-465: Share requires the complete Policy/v3 control plane before it
      # can create or receive an exact-email share. A version-only check let a
      # pre-TC-405 image look healthy while every required route returned 404.
      # Empty JSON is deliberately rejected before any handler can mutate
      # policy state, so this proves route mounting against the direct TEE
      # origin without creating a binding, challenge, policy, or delegation.
      - name: Verify deployed Policy/v3 routes
        run: |
          set -euo pipefail

          NODE_ORIGIN="https://tee.node.tinycloud.xyz"
          ROUTES=(
            /policy/v3/enforcer-bindings
            /policy/v3/policies
            /policy/v3/challenges
            /policy/v3/delegations
            /policy/v3/deliveries/authorize
          )

          for route in "${ROUTES[@]}"; do
            RESPONSE_FILE="$(mktemp)"
            STATUS="$(curl -sS --max-time 15 -o "${RESPONSE_FILE}" -w '%{http_code}' \
              -X POST \
              -H 'accept: application/json' \
              -H 'content-type: application/json' \
              --data '{}' \
              "${NODE_ORIGIN}${route}")"

            # Delivery is authenticated before request-body validation, so its
            # intentionally unsigned probe must be exactly 401. Other
            # control-plane routes reject the body first (400 or 422). Neither
            # case may silently accept a missing route or a server failure.
            if [ "${route}" = "/policy/v3/deliveries/authorize" ]; then
              EXPECTED="401"
              case "${STATUS}" in 401) VALID=true ;; *) VALID=false ;; esac
            else
              EXPECTED="400 or 422"
              case "${STATUS}" in 400|422) VALID=true ;; *) VALID=false ;; esac
            fi

            if [ "${VALID}" != true ]; then
              echo "::error::${route} returned HTTP ${STATUS}; expected ${EXPECTED} for an intentionally invalid unauthenticated request."
              head -c 1000 "${RESPONSE_FILE}" || true
              rm -f "${RESPONSE_FILE}"
              exit 1
            fi

            echo "${route}: mounted (HTTP ${STATUS})"
            rm -f "${RESPONSE_FILE}"
          done

      - name: Report unverified storage overrides
        if: >-
          ${{ always() && steps.deploy.outputs.cvm_mutation_attempted == 'true' && steps.quotas.outcome != 'success' }}
        run: |
          set -euo pipefail
          MESSAGE="OVERRIDES UNVERIFIED: a CVM mutation was attempted without successful authorized quota reconciliation. Authorized operator must resolve before another dispatch."
          echo "::error::${MESSAGE}"
          printf '%s\n' "${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # TC-1176: the 2026-10-14 read hang began ~40 min after a promote. After any
  # Phala deploy attempt (including rollbacks and failed verifications, which
  # may still have changed prod), start the Write Probe's dense promote watch:
  # reads every 30 s for 5 min, then every 5 min for 60 min, paging on 2 slow
  # (>5 s) or failed reads in a row. A separate job so the production-secret
  # deploy job never holds `actions: write`.
  promote-watch:
    runs-on: ubuntu-latest
    needs: [deploy-phala]
    if: ${{ always() && needs.deploy-phala.result != 'skipped' && needs.deploy-phala.result != 'cancelled' }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Write Probe promote watch
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.deploy-phala.outputs.image }}
          IMAGE_VERSION: ${{ needs.deploy-phala.outputs.version }}
          IMAGE_LABEL: ${{ needs.deploy-phala.outputs.image_label }}
          IMAGE_REVISION: ${{ needs.deploy-phala.outputs.revision }}
        run: |
          set -euo pipefail
          if [ -n "${IMAGE}" ]; then
            echo "Promote watch for ${IMAGE_LABEL} (version ${IMAGE_VERSION}) revision ${IMAGE_REVISION}: ${IMAGE}"
          else
            echo "Promote watch after deployment attempt; image validation did not complete."
          fi
          gh workflow run write-probe.yml -R "${GITHUB_REPOSITORY}" --ref main -f mode=dense

