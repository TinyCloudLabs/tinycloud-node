name: Docker Container

# TC-312: the release -> auto-deploy chain used to fire on the GitHub Release
# `published` event; it no longer does. release-plz.toml sets
# `git_release_enable = false`, so release-plz only pushes the `vX.Y.Z` tag —
# the GitHub Release itself is created by cargo-dist (release.yml) with the
# default `GITHUB_TOKEN`. GitHub deliberately does NOT emit workflow-triggering
# events (including `release`) for actions taken with `GITHUB_TOKEN`, to prevent
# recursive runs, so `on: release` here never fires from a cargo-dist release
# and prod could only be deployed by a manual `workflow_dispatch`.
#
# Fix: trigger on the tag push itself. release-plz pushes tags with a PAT
# (RELEASE_PLZ_TOKEN) and a manual `git push --tags` also emits a normal `push`
# event, so tag pushes reliably reach this workflow. `on: release` is kept for
# backward compatibility should a PAT-published Release ever reappear.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      include_duckdb:
        description: 'Build images with DuckDB support enabled'
        required: false
        type: boolean
        default: false
      include_tc_bench_v1:
        description: 'Build images with the tc-bench-v1 endpoints enabled'
        required: false
        type: boolean
        default: false
      deploy_phala:
        description: 'Deploy the dstack image to Phala after build'
        required: false
        type: boolean
        default: false
      image_version:
        description: 'Manual image version to tag/deploy, without leading v. Must equal the tinycloud-node version in tinycloud-node-server/Cargo.toml at the selected ref. Defaults to the selected ref name.'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tinycloudlabs/tinycloud-node

jobs:
  # TC-342: every image tag this workflow can produce must agree with the crate
  # version at the checked-out ref. `image_version` used to be unconstrained
  # free text, which is how an image got labelled 1.10.0 from a tree whose
  # Cargo.toml said 1.9.0 — prod then ran a binary that no tag in the repo
  # identified, and the team debugged a feature that was not in the deployed
  # image. Fail the whole workflow loudly instead of shipping a mislabelled tag.
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      cargo_version: ${{ steps.check.outputs.cargo_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate image version against Cargo.toml
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_VERSION: ${{ inputs.image_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # `|| true` so a missing match reaches the explicit check below
          # instead of dying under `set -e` with no explanation.
          CARGO_VERSION="$(grep -m1 -E '^version = "' tinycloud-node-server/Cargo.toml | cut -d '"' -f 2 || true)"
          if [ -z "${CARGO_VERSION}" ]; then
            echo "::error::could not read the tinycloud-node version from tinycloud-node-server/Cargo.toml"
            exit 1
          fi
          echo "cargo_version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tinycloud-node-server/Cargo.toml version: ${CARGO_VERSION}"

          check_matches() {
            label="$1"
            value="$2"
            if [ "${value#v}" != "${CARGO_VERSION}" ]; then
              echo "::error::${label} is '${value}' but tinycloud-node-server/Cargo.toml at this ref says '${CARGO_VERSION}'. Image tags must match the crate version — bump Cargo.toml via the release-plz release PR first (see docs/releasing.md)."
              exit 1
            fi
            echo "${label} '${value}' matches the crate version."
          }

          if [ "${EVENT_NAME}" = "release" ]; then
            check_matches "release tag" "${RELEASE_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            check_matches "git tag" "${GITHUB_REF_NAME}"
          fi

          if [ -n "${INPUT_IMAGE_VERSION}" ]; then
            check_matches "image_version input" "${INPUT_IMAGE_VERSION}"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [version-guard]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve optional build features
        id: build_features
        run: |
          FEATURES=""
          IMAGE_SUFFIX=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_duckdb }}" = "true" ]; then
            FEATURES="duckdb"
            IMAGE_SUFFIX="-duckdb"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_tc_bench_v1 }}" = "true" ]; then
            FEATURES="${FEATURES:+$FEATURES }tc-bench-v1"
            IMAGE_SUFFIX="${IMAGE_SUFFIX}-tc-bench-v1"
          fi
          echo "cargo_features=${FEATURES}" >> "$GITHUB_OUTPUT"
          echo "image_suffix=${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "manual_version=${{ inputs.image_version }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}},suffix=${{ steps.build_features.outputs.image_suffix }}
            type=raw,value=${{ steps.build_features.outputs.manual_version }}${{ steps.build_features.outputs.image_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && steps.build_features.outputs.manual_version != '' }}
            type=sha,prefix=
            type=raw,value=latest${{ steps.build_features.outputs.image_suffix }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CARGO_FEATURES=${{ steps.build_features.outputs.cargo_features }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dstack:
    runs-on: ubuntu-latest
    needs: [version-guard]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve optional build features
        id: build_features
        run: |
          FEATURES="dstack"
          IMAGE_SUFFIX=""
          SHA_PREFIX="dstack-"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_duckdb }}" = "true" ]; then
            FEATURES="dstack duckdb"
            IMAGE_SUFFIX="-duckdb"
            SHA_PREFIX="dstack-duckdb-"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_tc_bench_v1 }}" = "true" ]; then
            FEATURES="$FEATURES tc-bench-v1"
            IMAGE_SUFFIX="${IMAGE_SUFFIX}-tc-bench-v1"
            SHA_PREFIX="${SHA_PREFIX}tc-bench-v1-"
          fi
          echo "cargo_features=${FEATURES}" >> "$GITHUB_OUTPUT"
          echo "image_suffix=${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "sha_prefix=${SHA_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "manual_version=${{ inputs.image_version }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-dstack${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=-dstack${{ steps.build_features.outputs.image_suffix }}
            type=semver,pattern={{major}},suffix=-dstack${{ steps.build_features.outputs.image_suffix }}
            type=raw,value=${{ steps.build_features.outputs.manual_version }}-dstack${{ steps.build_features.outputs.image_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && steps.build_features.outputs.manual_version != '' }}
            type=sha,prefix=${{ steps.build_features.outputs.sha_prefix }}
            type=raw,value=dstack${{ steps.build_features.outputs.image_suffix }},enable={{is_default_branch}}

      - name: Build and push dstack Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CARGO_FEATURES=${{ steps.build_features.outputs.cargo_features }}
          cache-from: type=gha,scope=dstack
          cache-to: type=gha,mode=max,scope=dstack

  deploy-phala:
    runs-on: ubuntu-latest
    needs: [build, build-dstack]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_phala)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned deliberately. phala 1.1.20 (published 2026-07-26) fails against
      # the existing centralized-KMS prod CVM with "CVM encrypted_env_pubkey is
      # required for centralized KMS", which broke the 2026-07-28 deploy. The
      # last green deploy (run 29953848846, 2026-07-22) ran on 1.1.19. Only
      # unpin once the prod CVM is migrated or 1.1.20+ is verified against it.
      - name: Install Phala CLI
        run: npm install -g phala@1.1.19

      - name: Update compose with release tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.image_version }}"
            if [ -z "${TAG}" ]; then
              if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
                echo "::error::workflow_dispatch deploy_phala requires image_version unless the workflow is run from a tag"
                exit 1
              fi
              TAG="${GITHUB_REF_NAME}"
            fi
          fi
          # metadata-action emits {{version}} without the leading v (e.g. 1.3.0).
          # Strip a leading v from the tag to match the pushed image tag.
          VERSION="${TAG#v}"
          DUCKDB_SUFFIX=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_duckdb }}" = "true" ]; then
            DUCKDB_SUFFIX="-duckdb"
          fi
          # The prod CVM uses the dstack-suffixed image. Replace the floating
          # ":dstack" tag in the checked-in compose with the versioned tag
          # built by the build-dstack job (e.g. ":1.3.0-dstack" or
          # ":1.3.0-dstack-duckdb").
          sed -i "s|ghcr.io/tinycloudlabs/tinycloud-node:dstack|ghcr.io/tinycloudlabs/tinycloud-node:${VERSION}-dstack${DUCKDB_SUFFIX}|g" docker-compose.dstack-postgres.yaml
          echo "Resolved image tag: ghcr.io/tinycloudlabs/tinycloud-node:${VERSION}-dstack${DUCKDB_SUFFIX}"
          cat docker-compose.dstack-postgres.yaml

      - name: Deploy to Phala Cloud
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          PHALA_ENV_DATABASE_URL: ${{ secrets.PROD_TINYCLOUD_DATABASE_URL }}
          PHALA_ENV_S3_BUCKET: ${{ secrets.PROD_TINYCLOUD_S3_BUCKET }}
          PHALA_ENV_S3_ENDPOINT: ${{ secrets.PROD_TINYCLOUD_S3_ENDPOINT }}
          PHALA_ENV_AWS_KEY: ${{ secrets.PROD_TINYCLOUD_AWS_ACCESS_KEY_ID }}
          PHALA_ENV_AWS_SECRET: ${{ secrets.PROD_TINYCLOUD_AWS_SECRET_ACCESS_KEY }}
          PHALA_ENV_AWS_REGION: ${{ secrets.PROD_TINYCLOUD_AWS_REGION }}
          PHALA_ENV_TINYCLOUD_QUOTA_URL: ${{ secrets.PROD_TINYCLOUD_QUOTA_URL }}
          PHALA_ENV_TINYCLOUD_ADMIN_SECRET: ${{ secrets.PROD_TINYCLOUD_ADMIN_SECRET }}
          PHALA_ENV_SHARE_TRUST_BUNDLE_BASE64: ${{ secrets.PROD_TINYCLOUD_SHARE_TRUST_BUNDLE_BASE64 }}
          PHALA_ENV_CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_TINYCLOUD_CLOUDFLARE_API_TOKEN }}
          PHALA_ENV_DSTACK_GATEWAY_DOMAIN: ${{ secrets.PROD_TINYCLOUD_DSTACK_GATEWAY_DOMAIN }}
          PHALA_ENV_CERTBOT_EMAIL: ${{ secrets.PROD_TINYCLOUD_CERTBOT_EMAIL }}
        # Update the existing prod CVM (name: tinycloud-node) in the
        # Tiny Cloud workspace. The PHALA_CLOUD_API_KEY secret is
        # workspace-scoped and must be issued from that workspace.
        run: |
          set -euo pipefail

          required_vars=(
            PHALA_CLOUD_API_KEY
            PHALA_ENV_DATABASE_URL
            PHALA_ENV_S3_BUCKET
            PHALA_ENV_S3_ENDPOINT
            PHALA_ENV_AWS_KEY
            PHALA_ENV_AWS_SECRET
            PHALA_ENV_AWS_REGION
            PHALA_ENV_TINYCLOUD_QUOTA_URL
            PHALA_ENV_TINYCLOUD_ADMIN_SECRET
            PHALA_ENV_SHARE_TRUST_BUNDLE_BASE64
            PHALA_ENV_CLOUDFLARE_API_TOKEN
            PHALA_ENV_DSTACK_GATEWAY_DOMAIN
            PHALA_ENV_CERTBOT_EMAIL
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required GitHub secret for Phala deploy: ${var#PHALA_ENV_}"
              exit 1
            fi
          done

          {
            printf 'DATABASE_URL=%s\n' "$PHALA_ENV_DATABASE_URL"
            printf 'S3_BUCKET=%s\n' "$PHALA_ENV_S3_BUCKET"
            printf 'S3_ENDPOINT=%s\n' "$PHALA_ENV_S3_ENDPOINT"
            printf 'AWS_KEY=%s\n' "$PHALA_ENV_AWS_KEY"
            printf 'AWS_SECRET=%s\n' "$PHALA_ENV_AWS_SECRET"
            printf 'AWS_REGION=%s\n' "$PHALA_ENV_AWS_REGION"
            printf 'TINYCLOUD_QUOTA_URL=%s\n' "$PHALA_ENV_TINYCLOUD_QUOTA_URL"
            printf 'TINYCLOUD_ADMIN_SECRET=%s\n' "$PHALA_ENV_TINYCLOUD_ADMIN_SECRET"
            printf 'SHARE_TRUST_BUNDLE_BASE64=%s\n' "$PHALA_ENV_SHARE_TRUST_BUNDLE_BASE64"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PHALA_ENV_CLOUDFLARE_API_TOKEN"
            printf 'DSTACK_GATEWAY_DOMAIN=%s\n' "$PHALA_ENV_DSTACK_GATEWAY_DOMAIN"
            printf 'CERTBOT_EMAIL=%s\n' "$PHALA_ENV_CERTBOT_EMAIL"
            # SSH public keys authorized on the CVM (checked into the repo,
            # see dstack-authorized-keys). The Phala Cloud pre-launch script
            # writes DSTACK_AUTHORIZED_KEYS to /home/root/.ssh/authorized_keys
            # at boot, enabling `phala ssh tinycloud-node`.
            printf 'DSTACK_AUTHORIZED_KEYS=%s\n' "$(cat dstack-authorized-keys)"
          } > .phala-prod.env

          # Fail before replacing the running CVM if a required compose input
          # is absent. Phala's control-plane ready state does not prove that
          # docker compose interpolation or container startup succeeded.
          docker compose --env-file .phala-prod.env \
            -f docker-compose.dstack-postgres.yaml config --quiet

          phala deploy --cvm-id tinycloud-node -c docker-compose.dstack-postgres.yaml -e .phala-prod.env --wait

      # TC-312: prove the deploy actually converged. The image tag matching the
      # crate version is enforced at build time by version-guard, but nothing
      # previously confirmed the running CVM serves it — the incident where prod
      # reported a stale version went unnoticed for exactly this reason. Poll the
      # public /version endpoint and fail the job if it never reports the tag we
      # just deployed.
      - name: Verify deployed version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          set -euo pipefail

          # Resolve the version we just deployed, mirroring the compose step.
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_TAG}"
          elif [ -n "${INPUT_IMAGE_VERSION}" ]; then
            TAG="${INPUT_IMAGE_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          EXPECTED="${TAG#v}"
          echo "Expecting node.tinycloud.xyz to report version ${EXPECTED}"

          # The CVM needs a short while to pull the new image and restart, so
          # retry with a fixed backoff (~5 min total) before giving up.
          ATTEMPTS=30
          SLEEP=10
          REPORTED=""
          for i in $(seq 1 "${ATTEMPTS}"); do
            REPORTED="$(curl -fsS --max-time 15 https://node.tinycloud.xyz/version | jq -r '.version' || true)"
            echo "attempt ${i}/${ATTEMPTS}: /version reported '${REPORTED}'"
            if [ "${REPORTED}" = "${EXPECTED}" ]; then
              echo "node.tinycloud.xyz is serving ${EXPECTED}."
              exit 0
            fi
            sleep "${SLEEP}"
          done

          echo "::error::node.tinycloud.xyz still reports '${REPORTED}' after $((ATTEMPTS * SLEEP))s, expected '${EXPECTED}'. The deploy did not converge."
          exit 1

      # TC-465: Share requires the complete Policy/v3 control plane before it
      # can create or receive an exact-email share. A version-only check let a
      # pre-TC-405 image look healthy while every required route returned 404.
      # Empty JSON is deliberately rejected before any handler can mutate
      # policy state, so this proves route mounting against the direct TEE
      # origin without creating a binding, challenge, policy, or delegation.
      - name: Verify deployed Policy/v3 routes
        run: |
          set -euo pipefail

          NODE_ORIGIN="https://tee.node.tinycloud.xyz"
          ROUTES=(
            /share/v3/enforcer-bindings
            /share/v3/policies
            /share/v3/policy/challenges
            /share/v3/policy/delegations
          )

          # The direct TEE ingress obtains/loads its certificate after the
          # node's public /version endpoint is already healthy. Wait for that
          # TLS endpoint before probing routes so a successful rollout does
          # not fail on a transient SSL_ERROR_SYSCALL during ingress startup.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${NODE_ORIGIN}/version" > /dev/null; then
              echo "Direct TEE ingress is ready."
              break
            fi
            if [ "${attempt}" = "30" ]; then
              echo "::error::Direct TEE ingress did not become ready after 150s."
              exit 1
            fi
            sleep 5
          done

          for route in "${ROUTES[@]}"; do
            RESPONSE_FILE="$(mktemp)"
            STATUS="$(curl -sS --max-time 15 -o "${RESPONSE_FILE}" -w '%{http_code}' \
              -X POST \
              -H 'accept: application/json' \
              -H 'content-type: application/json' \
              --data '{}' \
              "${NODE_ORIGIN}${route}")"

            if [ "${STATUS}" != "400" ] && [ "${STATUS}" != "422" ]; then
              echo "::error::${route} returned HTTP ${STATUS}; expected 400 or 422 for an intentionally invalid request. The Policy/v3 production contract is not mounted correctly."
              head -c 1000 "${RESPONSE_FILE}" || true
              rm -f "${RESPONSE_FILE}"
              exit 1
            fi

            echo "${route}: mounted (HTTP ${STATUS})"
            rm -f "${RESPONSE_FILE}"
          done
