          else:
              if mode != 'unselected':
                  raise SystemExit('::error::Rollback privacy cannot modify a forward/current-compose deployment')
              raw = read_artifact(str(path))
              digest = hashlib.sha256(raw).hexdigest()
              n0_configuration = n0_template(raw)
              if os.environ['RESOLVED_IMAGE'] == reviewed:
                  if not n0_configuration and digest not in (pre_n0_hash, pre_n0_template_hash):
                      raise SystemExit('::error::Same-image recovery requires the exact current pre-N0 or reviewed N0 compose')
                  require_not_older_than_running(os.environ['LABEL_REVISION'])
              elif n0_configuration:
                  require_release()
          content = raw.decode('utf-8')
          images = [
              image for image in re.finditer(r'(?m)^([ \t]+image:[ \t]+)([^\n]+)$', content)
              if image[2].strip().strip('"\'').startswith((native + ':', native + '@'))
          ]
          value = images[0][2].strip().strip('"\'') if len(images) == 1 else ''
          if not n0_configuration and value not in (native + ':dstack', reviewed):
              raise SystemExit('Expected exactly one :dstack or reviewed digest-pinned native image')
          if not n0_configuration and value == reviewed and reviewed != os.environ['RESOLVED_IMAGE']:
              raise SystemExit('Reviewed compose digest does not match the selected deployment image')
          image = images[0]
          deployed = (content[:image.start(2)] + os.environ['RESOLVED_IMAGE'] + content[image.end(2):]).encode('utf-8')
          selected_digest = os.environ['RESOLVED_IMAGE'].rsplit(':', 1)[1].encode()
          if n0_configuration and (not n0_template(deployed) or [pin[1] for pin in node_pin.finditer(deployed)] != [selected_digest]):
