          PY
          {
            echo "image=${RESOLVED_IMAGE}"
            echo "version=${VERSION%%-dstack*}"
            echo "revision=${REVISION}"
            echo "image_label=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${RESOLVED_IMAGE} (revision ${REVISION}, version ${VERSION})"
