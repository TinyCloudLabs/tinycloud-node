              # its labels, vX.Y.Z tag and crate version must all agree.
              refuse = '::error::Reviewed N0 compose accepts only a recorded released main image; deployment not attempted'
              label = re.fullmatch(r'([0-9]+\.[0-9]+\.[0-9]+)-dstack', os.environ['LABEL_VERSION'])
              revision = os.environ['LABEL_REVISION']
              if (not label or not re.fullmatch(r'[0-9a-f]{40}', revision) or not os.environ.get('INPUT_DEPLOY_DIGEST')
                      or os.environ['RESOLVED_IMAGE'] != native + '@' + os.environ['INPUT_DEPLOY_DIGEST']
                      or os.environ.get('ROLLBACK_VERSION') != label[1] or os.environ.get('ROLLBACK_REVISION') != revision):
                  raise SystemExit(refuse)
              if git('rev-parse', '--verify', '--quiet', f'refs/tags/v{label[1]}^{{commit}}').strip() != revision:
                  raise SystemExit(refuse)
              crate = re.search(r'(?m)^version = "([^"]*)"$', git('show', f'{revision}:tinycloud-node-server/Cargo.toml'))
              if not crate or crate[1] != label[1]:
                  raise SystemExit(refuse)
              require_release_descends(revision)

          def is_ancestor(older, newer):
              return subprocess.run(['git', 'merge-base', '--is-ancestor', older, newer], capture_output=True).returncode == 0

          running = os.environ.get('RUNNING_REVISION', '')

          def require_not_older_than_running(revision):
              # No cross-migration downgrade: the running production revision
              # must be the deployed image's revision or its ancestor.
              if running and not is_ancestor(running, revision):
                  raise SystemExit('::error::Refusing to deploy an image older than the running production revision; use the captured pre-N0 rollback for an intentional rollback')

          def require_release_descends(revision):
              if not re.fullmatch(r'[0-9a-f]{40}', running) or running == revision or not is_ancestor(running, revision):
