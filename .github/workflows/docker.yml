          pre_n0_hash = 'df239749ca0a9c09893a855ae2a8abb94090b8556515ad002105c58ac91f4c91'
          pre_n0_template_hash = '28302d6761d841b7cc5c11314aed2d377735e6bbdcaf85972a752e03bc9fdc93'
          rollback = os.environ.get('ROLLBACK_PRE_N0') == 'true'
          mode = os.environ.get('ROLLBACK_PRIVACY_MODE') or 'unselected'
          if rollback:
              raw = read_artifact('ops/rollback/pre-n0-compose.yaml')
              if os.environ['RESOLVED_IMAGE'] != reviewed or hashlib.sha256(raw).hexdigest() != pre_n0_hash:
                  raise SystemExit('::error::Captured pre-N0 image/compose pin mismatch; deployment not attempted')
              if mode not in ('keep-json-file', 'stop-future-local-logs') or mode != os.environ.get('APPROVED_ROLLBACK_PRIVACY_MODE'):
