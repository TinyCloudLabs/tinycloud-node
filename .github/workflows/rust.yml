name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# TC-381: build/clippy/fmt used to run over a four-entry `pkg` matrix
# ("tinycloud-auth", "tinycloud-node-server", "tinycloud-sdk-rs",
# "tinycloud-sdk-wasm"), which covered 4 of the workspace's 10 members. The
# uncovered six included tinycloud-core — the delegation/epoch crate — whose
# only CI exposure was a single name-filtered `cargo test`. They also included
# tinycloud-verifier-wasm, whose test target could not even compile, and the
# vendored dependencies/siwe, which held a test broken by a repo-wide rename.
# Every job below now runs over the whole workspace so that cannot recur.
#
# The matrix also carried `if: matrix.pkg == 'sdk-wasm'` in three places, which
# never matched any matrix value and so never once ran; its inverse at the
# `cargo test` step was therefore always true. The intent — build the wasm
# crates for wasm32-unknown-unknown — is now a real, unconditional step in the
# `build` job.
jobs:
  build:
    name: build (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout TinyCloud repository
      uses: actions/checkout@v4

    - name: Install reviewed Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: rust-1.97.1-dev-default
        workspaces: . -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Add the wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Build the workspace
      run: cargo build --workspace --all-targets

    # The wasm crates ship as wasm32 artifacts; building them only for the host
    # target would not prove they still compile for the target they exist for.
    - name: Build the wasm crates for wasm32-unknown-unknown
      run: cargo build -p tinycloud-sdk-wasm -p tinycloud-verifier-wasm --target wasm32-unknown-unknown

  test:
    name: test (workspace, PostgreSQL-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TINYCLOUD_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      TINYCLOUD_TEST_MYSQL_URL: mysql://root@127.0.0.1:3306/mysql
      # TC-1054: tests/postgres_pool_timeouts.rs black-holes chosen loopback
      # connections with exact-4-tuple iptables DROP rules (the runner is a
      # throwaway VM with passwordless sudo). Unset, they fail under CI.
      TINYCLOUD_TEST_BLACKHOLE: "1"
    steps:
    - name: Checkout TinyCloud repository
      uses: actions/checkout@v4

    - name: Install reviewed Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt

    # TC-381: this job used to run `cargo test -p tinycloud-core postgres_`.
    # libtest exits 0 when a name filter matches zero tests, and all four
    # targets returned early when TINYCLOUD_TEST_POSTGRES_URL was unset — so
    # renaming the tests, or dropping the env block, would have left the job
    # green having asserted nothing, with nothing to say so. The name filter is
    # gone (the whole workspace suite runs now) and the two remaining ways to
    # silently execute nothing are both checked below.
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: rust-1.97.1-test-default-duckdb
        workspaces: . -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Assert PostgreSQL is reachable
      run: |
        set -euo pipefail
        : "${TINYCLOUD_TEST_POSTGRES_URL:?must be set for the PostgreSQL regressions}"
        pg_isready -h localhost -p 5432 -U postgres
        psql "${TINYCLOUD_TEST_POSTGRES_URL}" -c 'SELECT version();'
        # The TC-1054 black-hole tests need iptables through sudo.
        sudo -n iptables -w -L OUTPUT -n >/dev/null

    - name: Assert the PostgreSQL regressions still exist
      run: |
        set -euo pipefail
        # `|| true` so a zero match reaches the explicit check below rather
        # than dying under `set -e` with no explanation.
        count="$(cargo test -p tinycloud-core --lib -- --list \
          | grep -cE '::postgres_[a-z0-9_]+: test$' || true)"
        echo "PostgreSQL regressions discovered: ${count}"
        if [ "${count}" -lt 5 ]; then
          echo "::error::expected at least 5 postgres_* regressions in tinycloud-core, found ${count}. They were renamed or deleted — restore them, or update this guard deliberately (TC-381)."
          exit 1
        fi

    # The five postgres_* regressions run as part of this suite, against the
    # service container above. tinycloud-core's other ~300 tests — which no CI
    # job had ever executed — run here too.
    - name: Run the workspace test suite
      run: cargo test --workspace

    # The workspace suite does not enable tinycloud-core's DuckDB feature.
    # Run its unit tests with that feature so SQL/DuckDB identity parity is
    # checked in CI as well as through the excluded W5 wire-test crate.
    - name: Run DuckDB-enabled core tests
      run: cargo test -p tinycloud-core --features duckdb

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout TinyCloud repository
      uses: actions/checkout@v4

    - name: Install reviewed Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: rust-1.97.1-dev-default
        workspaces: . -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Add the wasm32 target
      run: rustup target add wasm32-unknown-unknown

    # --all-targets so test and bench targets are linted too, not just lib/bin.
    - name: Clippy
      run: RUSTFLAGS="-Dwarnings" cargo clippy --workspace --all-targets

  fmt:
    name: fmt (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout TinyCloud repository
      uses: actions/checkout@v4

    - name: Install reviewed Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt

    - name: Fmt
      run: cargo fmt --all -- --check

  capabilities:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout TinyCloud repository
      uses: actions/checkout@v4
    - name: Install reviewed Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Verify generated capability artifacts match capabilities.json
      run: node scripts/gen-capabilities.mjs --check
    - name: Verify deployed Policy/v3 probe contract
      run: node scripts/check-deployment-policy-probes.mjs
    - name: Verify the main-only production deploy guard (TC-940)
      run: bash scripts/ci/test-check-deploy-ref.sh

  # test/m1-realdata-e2e, test/load/signer and test/w5-policy-runtime-node-e2e
  # are `exclude`d from the workspace in Cargo.toml, so the workspace-wide jobs
  # above do not reach them. m1-realdata-e2e is covered by the job below.
  # w5-policy-runtime-node-e2e (including the TC-780 SQL/DuckDB isolation suite
  # in tests/sql_isolation.rs) depends on the private TinyCloudLabs/policy-engine
  # repository by git, which this workflow's token cannot clone, so it runs
  # locally before a release (`cargo test --locked --manifest-path
  # test/w5-policy-runtime-node-e2e/Cargo.toml`); a CI job needs a read token
  # for that repository first. test/load/signer is covered by no job at all.
  # Recorded here rather than left implicit.
  m1-realdata:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
    - name: Checkout TinyCloud repository
      uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: rust-1.97.1-test-m1-realdata
        workspaces: test/m1-realdata-e2e -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install M1 vector generator dependencies
      run: python -m pip install --requirement test/m1-realdata-e2e/requirements.txt
    - name: Check M1 scripts and formatting
      run: |
        bash -n scripts/m1-gate-demo.sh
        bash -n test/m1-realdata-e2e/scripts/snapshot-node-db.sh
        cargo fmt --manifest-path test/m1-realdata-e2e/Cargo.toml -p m1-realdata-e2e -- --check
    - name: Run deterministic M1 contract tests
      run: cargo test --locked --manifest-path test/m1-realdata-e2e/Cargo.toml
