# Reports changed/removed tests for review in the same PR. No separate ruling
# is required. This is an advisory; test execution and normal review still apply.
name: Test edit guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: test-edit-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Test edit guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Self-test the guard
        run: timeout 120 node .github/scripts/test-edit-guard.mjs --self-test

  guard:
    # Retain the existing check name so branch protection does not wait for a renamed check.
    name: No unruled edits to existing tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Summarize test changes for review
        run: timeout 180 node .github/scripts/test-edit-guard.mjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
