name: logship-coverage

# TC-3284: every node warn/error line outside tests must ship with a named event_code, so a new or newly reachable
# warning never lands in Better Stack as `unclassified`. Node-only edits run just this test, not the full Vector job.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tinycloud-core/src/**'
      - 'tinycloud-node-server/src/**'
      - 'log-shipper/coverage*.mjs'
      - 'log-shipper/diagnostics.json'
      - 'log-shipper/fields.json'
      - '.github/workflows/logship-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'tinycloud-core/src/**'
      - 'tinycloud-node-server/src/**'
      - 'log-shipper/coverage*.mjs'
      - 'log-shipper/diagnostics.json'
      - 'log-shipper/fields.json'
      - '.github/workflows/logship-coverage.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diagnostic-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Every node warn/error message maps to a named event_code
        run: node --test log-shipper/coverage.test.mjs
