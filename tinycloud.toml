[global]
log_level = "normal"
# address = "127.0.0.1"
port = 8000
cors = true

[global.storage]
    ## Root directory for all local data (database, blocks, sql, duckdb).
    ## Individual paths below can override if needed.
    ## Env: TINYCLOUD_STORAGE_DATADIR
    datadir = "./data"

    ## Set the file-staging system for TinyCloud Protocol to use
    staging = "FileSystem"

    ## Set the default limit for KV storage per Space
    # limit = "10 MiB"

    ## Override individual paths (defaults derived from datadir):
    # database = "sqlite:./data/caps.db"
    # [global.storage.sql]
    # path = "./data/sql"
    ## Wait bounds before a SQL request answers 503 sql_busy (TC-1274).
    ## Env: TINYCLOUD_STORAGE__SQL__<NAME>, e.g. TINYCLOUD_STORAGE__SQL__LOCK_WAIT_TIMEOUT_MS
    # lock_wait_timeout_ms = 30000
    # hydration_wait_timeout_ms = 30000
    # artifact_transfer_timeout_ms = 45000
    # hydration_max_ms = 600000          # a hydration keeps warming after its callers give up
    ## Schema-changing SQL (CREATE/ALTER/DROP of tables, views and indexes) needs
    ## tinycloud.sql/schema (TC-1581); tinycloud.sql/write covers data statements.
    ## "enforce" (default) refuses the statement, "log" runs it and records it
    ## (a constant warning and a counter by statement kind, no request content),
    ## "off" restores the earlier rule that write also suffices for those
    ## statements; the release's other restrictions apply in every mode. See docs/sql-schema-authority.md.
    # ddl_requires_schema = "enforce"
    # [global.storage.duckdb]
    # path = "./data/duckdb"

    [global.storage.blocks]
    type = "Local"
    # path = "./data/blocks"   # defaults to {datadir}/blocks

[global.database]
    ## PostgreSQL pool limits (TC-1054); see README "PostgreSQL pool limits".
    ## Env: TINYCLOUD_DATABASE__<NAME>, e.g. TINYCLOUD_DATABASE__STATEMENT_TIMEOUT_MS
    # max_connections = 100
    # idle_timeout_secs = 210
    # max_lifetime_secs = 1800
    # tcp_keepalive = true
    # tcp_keepalive_idle_secs = 15
    # tcp_keepalive_interval_secs = 5
    # tcp_keepalive_retries = 3
    # tcp_user_timeout_ms = 30000
    # statement_timeout_mode = "session"   # session | local | off
    # statement_timeout_ms = 30000
    # bulk_statement_timeout_ms = 120000
    # retry_window_ms = 10000
    ## How long an authorized read waits for its audit record before 503
    ## read_audit_busy (TC-1317). Its data is never returned without the record.
    # read_audit_wait_ms = 20000

[global.invocation]
    ## /invoke deadline (TC-1274): before any write, the request is stopped and
    ## answered 503 request_timeout. Keep it below the ingress timeout (60 s). 0 = off.
    ## Env: TINYCLOUD_INVOCATION__DEADLINE_MS
    # deadline_ms = 55000

[global.keys]
    # Provision a unique, persistent root before starting this node.
    # TINYCLOUD_KEYS__SECRET supplies it; Dstack deployments explicitly
    # select TINYCLOUD_KEYS__TYPE=Dstack instead.
    type = "Static"

[global.spaces]
## Space allow list api endpoint
# allowlist = "http://localhost:10000"

[global.telemetry]
    ## Enable Prometheus latency metrics on global.prometheus.port.
    ## Env: TINYCLOUD_TELEMETRY__ENABLED
    enabled = false

[global.did_resolution]
    ## UCAN issuers resolve only did:key (Ed25519), did:pkh (eip155) and did:jwk.
    ## Other DID methods are refused before any resolution. No setting enables them.

[global.encryption_network]
    ## Serve named keys and advertise the `encryption-named-keys-v1` feature in
    ## GET /info. Only while on are the key routes mounted, key and key-prefix
    ## resources accepted in delegations and named-key decrypt served on
    ## POST /invoke. Keep off until named keys are live on OpenKey.
    ## Env: TINYCLOUD_ENCRYPTION_NETWORK__NAMED_KEYS_V1
    # named_keys_v1 = false

[global.sql]
    ## Accept the `tables` / `columns` / `readOnly` caveat form on
    ## `tinycloud.sql/*` delegations, enforce it from the delegation chain on
    ## every SQL request, and advertise `sql-delegated-caveats-v1` in GET /info.
    ## Off = such a delegation is refused as an unsupported caveat and the
    ## feature is withheld.
    ## Env: TINYCLOUD_SQL__DELEGATED_CAVEATS_ENFORCED
    # delegated_caveats_enforced = false
