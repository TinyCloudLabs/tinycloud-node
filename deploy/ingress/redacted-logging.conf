# TC-970: log each request without anything that identifies a user or carries a
# credential. Request paths can hold signed-KV tickets (`/signed/kv/<ticket>`),
# space IDs, which embed wallet addresses (`/public/<space_id>/...`), and KV
# keys; query strings can hold hook tickets (`/hooks/events?ticket=`). Only the
# path classes are logged, never `$request`, `$request_uri`, `$uri`, `$args`,
# the client address, `Referer` or `User-Agent`. Unknown paths are logged as
# `<other>`, unknown methods as `<other>`.
#
# `route` classifies the path by the node's route shapes; it is not the route
# Rocket matched. The map ignores the method (an `OPTIONS` preflight on
# `/signed/kv/<ticket>` logs as `/signed/kv/<ticket_id>`), and nginx compares
# the literal keys case-insensitively (`/HEALTHZ` logs as `/healthz`).
# Keep this list in step with the node's mounted routes (`production_routes()`).
map $uri $tc_route {
    default                                         "<other>";

    /healthz                                        /healthz;
    /info                                           /info;
    /version                                        /version;
    /invoke                                         /invoke;
    /delegate                                       /delegate;
    /revoke                                         /revoke;
    /attestation                                    /attestation;
    /signed/kv                                      /signed/kv;
    /admin/quota                                    /admin/quota;
    /admin/usage                                    /admin/usage;
    /hooks/events                                   /hooks/events;
    /hooks/tickets                                  /hooks/tickets;
    /hooks/webhooks                                 /hooks/webhooks;
    /delegation/query                               /delegation/query;
    /delegation/status                              /delegation/status;
    /encryption/networks                            /encryption/networks;
    /policy/v3/status                               /policy/v3/status;
    /policy/v3/policies                             /policy/v3/policies;
    /policy/v3/challenges                           /policy/v3/challenges;
    /policy/v3/delegations                          /policy/v3/delegations;
    /policy/v3/enforcer-bindings                    /policy/v3/enforcer-bindings;
    /policy/v3/deliveries/authorize                 /policy/v3/deliveries/authorize;
    /.well-known/tinycloud/node-keys                /.well-known/tinycloud/node-keys;

    ~^/signed/kv/[^/]+$                             "/signed/kv/<ticket_id>";
    ~^/public/[^/]+/kv$                             "/public/<space_id>/kv";
    ~^/public/[^/]+/kv/                             "/public/<space_id>/kv/<key..>";
    ~^/admin/quota/[^/]+$                           "/admin/quota/<space_id>";
    ~^/peer/generate/[^/]+$                         "/peer/generate/<space>";
    ~^/hooks/webhooks/[^/]+$                        "/hooks/webhooks/<subscription_id>";
    ~^/encryption/networks/[^/]+$                   "/encryption/networks/<network_id>";
    ~^/encryption/networks/[^/]+/revoke$            "/encryption/networks/<network_id>/revoke";
    ~^/encryption/networks/[^/]+/decrypt$           "/encryption/networks/<network_id>/decrypt";
    ~^/policy/v3/status/[^/]+$                      "/policy/v3/status/<root_cid>";
    ~^/\.well-known/encryption/network/[^/]+$       "/.well-known/encryption/network/<name>";
    ~^/evidences/                                   "/evidences/<file>";
}

# The method is client-chosen text; log only known ones.
map $request_method $tc_method {
    default     "<other>";
    GET         GET;
    HEAD        HEAD;
    POST        POST;
    PUT         PUT;
    PATCH       PATCH;
    DELETE      DELETE;
    OPTIONS     OPTIONS;
}

log_format tc_redacted escape=json
    '{"time":"$time_iso8601","method":"$tc_method","route":"$tc_route",'
    '"protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_response_time":"$upstream_response_time"}';

# stdout, so retention and size are the container runtime's concern.
access_log /dev/stdout tc_redacted;

# Errors raised while serving a request carry the client address and the raw
# request line (`client: ..., request: "GET /signed/kv/<ticket> ..."`), at any
# level: even an `alert` (a failed write of this access log) does. So the http
# context logs only `emerg`. A failed upstream shows up as
# `status`/`upstream_status` in the access log above. Process-level messages
# (start, reload, shutdown) go to stderr from the main context (nginx.conf).
error_log /dev/stderr emerg;
