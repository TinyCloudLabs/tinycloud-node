name: personal-node
services:
  node:
    image: ${NODE_IMAGE:-ghcr.io/tinycloudlabs/tinycloud-node@sha256:2f3c65d85aa94610456bf09cd54713bab5260097bb3d56858025bc6eadb5a4a0}
    restart: unless-stopped
    env_file:
      - ${NODE_KEY_ENV_FILE:?Set the private node key file}
    environment:
      TINYCLOUD_STORAGE__DATADIR: /data
      ROCKET_ADDRESS: 0.0.0.0
    volumes:
      - ${NODE_DATA_DIR:?Set the node data directory}:/data
      # This config masks the one copied into the image. The 1.20.6 image,
      # the starting point of the upgrade rehearsal, embeds a sample key in
      # its default TOML; the 1.22.0 image does not. The mount applies to both
      # and fails closed when the operator key is absent.
      - ./tinycloud.toml:/tinycloud.toml:ro
    security_opt:
      - no-new-privileges:true

  https:
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    depends_on:
      - node
    ports:
      - "${NODE_HTTP_BIND:-80:80}"
      - "${NODE_HTTPS_BIND:-443:443}"
    environment:
      NODE_DOMAIN: ${NODE_DOMAIN:?Set your domain}
    volumes:
      - ${NODE_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
