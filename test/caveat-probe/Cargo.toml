[package]
name = "tinycloud-caveat-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
k256 = { version = "0.13.4", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = "1"
serde_json = "1"
sha3 = "0.10"
tinycloud-auth = { path = "../../tinycloud-auth" }
tinycloud-sdk-rs = { path = "../../tinycloud-sdk-rs" }
tinycloud-sdk-wasm = { path = "../../tinycloud-sdk-wasm" }
uuid = { version = "1", features = ["v4"] }

# Outside the node workspace (root `exclude`), so the release image's
# `cargo chef` recipe never needs this crate. Same security patch as the root.
[patch.crates-io]
slab = { git = "https://github.com/tokio-rs/slab", tag = "v0.4.11" }
