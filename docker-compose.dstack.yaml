# dstack deployment - Topology 1: SQLite + Local Storage
# Single container, everything in the CVM. Good for small/personal instances.
#
# Deploy on dstack:
#   docker build --build-arg CARGO_FEATURES=dstack -t tinycloud-dstack .
#   # DuckDB is opt-in:
#   docker build --build-arg "CARGO_FEATURES=dstack duckdb" -t tinycloud-dstack-duckdb .
#   # Or use the pre-built image from ghcr.io
#
# The same image works on dstack (TEE) and classic (non-TEE) deployments.
# In TEE mode, keys are derived from dstack KMS - never stored, never exposed.
# In classic mode, set TINYCLOUD_KEYS_SECRET manually.

services:
  tinycloud:
    image: ghcr.io/tinycloudlabs/tinycloud-node@sha256:4bdae4fc232d886bb56bfbce4ec62ed4b8fb4e1369a01f6afb73d06dd68c188f
    ports:
      # Port 8001 (Prometheus /metrics) is intentionally NOT published: the
      # metrics handler is unauthenticated and serves every series to anyone,
      # so it must stay internal to the CVM rather than reachable via the
      # dstack gateway.
      - "8000:8000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - tinycloud-data:/data
    environment:
      TINYCLOUD_KEYS_TYPE: Dstack
      TINYCLOUD_STORAGE__DATADIR: /data
      TINYCLOUD_LOG_LEVEL: normal
      TINYCLOUD_CORS: "true"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_MAX_BLOCKING: "1024"

volumes:
  tinycloud-data:
