# dstack deployment - Topology 2: Postgres + S3
# tinycloud-node in the CVM, Postgres external.
# Database credentials encrypted by dstack KMS.
# Column encryption enabled for sensitive data.
#
# All ${...} variables should be encrypted using dstack's KMS public key
# before deployment. The operator never sees plaintext values.

services:
  tinycloud:
    # DuckDB-enabled images are opt-in and use the -duckdb suffix, for example:
    # ghcr.io/tinycloudlabs/tinycloud-node:1.4.0-dstack-duckdb
    image: ghcr.io/tinycloudlabs/tinycloud-node:dstack
    restart: unless-stopped
    # TC-959: the GELF driver emits the exact label to Vector's UDP port on the
    # host loopback; it never blocks app startup when Vector is unavailable.
    labels:
      tc.logship: "tinycloud-node"
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        labels: "tc.logship"
    ports:
      - "8000:8000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      TINYCLOUD_KEYS_TYPE: Dstack
      TINYCLOUD_STORAGE_DATABASE: "${DATABASE_URL}"
      TINYCLOUD_STORAGE_BLOCKS_TYPE: S3
      TINYCLOUD_STORAGE_BLOCKS_BUCKET: "${S3_BUCKET}"
      TINYCLOUD_STORAGE_BLOCKS_ENDPOINT: "${S3_ENDPOINT}"
      AWS_ACCESS_KEY_ID: "${AWS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET}"
      AWS_DEFAULT_REGION: "${AWS_REGION}"
      TINYCLOUD_LOG__FORMAT: Json
      TINYCLOUD_LOG_LEVEL: normal
      # Enable Prometheus telemetry (metrics, span histograms, pool gauges).
      # The metrics handler is intentionally NOT gateway-exposed: port 8001 is
      # not published here, so the unauthenticated /metrics endpoint stays
      # internal to the CVM.
      TINYCLOUD_TELEMETRY__ENABLED: "true"
      # The managed Postgres instance allows max_connections = 25 (measured
      # 2026-07-29, with some of those reserved for superuser roles). The pool
      # default of 100 cannot be satisfied: the node opened and held slots
      # until the instance ran out, and further requests failed with
      # "Failed to acquire connection from pool: Connection pool timed out"
      # after the 30s sqlx default. Keep this below the instance limit with
      # headroom for admin/psql access, and raise it only alongside the
      # instance's own max_connections.
      TINYCLOUD_DATABASE__MAX_CONNECTIONS: "15"
      # Required for every manual TC-780 deploy. Keep true through offline
      # verification; only the final, explicitly reviewed redeploy sets false.
      TINYCLOUD_DATABASE__WRITE_FENCE: "${SQL_IDENTITY_FENCE:?set true during cutover, false after verification}"
      TINYCLOUD_CORS: "true"
      # --- addressed sharing (TC-397) ------------------------------------
      #
      # The public trust document shared with Share and OpenCredentials,
      # delivered inline because nothing else can reach this container: the
      # image is `FROM scratch` (no shell, so share-api's decode-to-tmpfs
      # entrypoint cannot work here) and a dstack deployment uploads only
      # this compose file (so there is no host path to bind-mount from).
      #
      # Seal the base64 of the reviewed trust-bundle.production.json — the
      # same bytes share-api serves — into the CVM's encrypted environment as
      # SHARE_TRUST_BUNDLE_BASE64. Same variable name and same wire form
      # share-api already uses, so one sealed value feeds both services and
      # cannot drift between them.
      #
      # The `:?` form is deliberate: compose refuses to interpolate a partial
      # deployment, failing loudly at deploy time rather than letting the node
      # die at boot with "share email trust bundle is required".
      TINYCLOUD_SHARE_EMAIL__ENABLED: "true"
      TINYCLOUD_SHARE_EMAIL__TRUST_BUNDLE_BASE64: "${SHARE_TRUST_BUNDLE_BASE64:?seal the reviewed share-email trust bundle, base64-encoded}"
      # The sealed DATABASE_URL already carries sslmode=verify-full as its sole
      # query parameter. ROOT_CERT_PATH stays unset so verify-full resolves
      # against the compiled-in public root set (TC-363).
      TINYCLOUD_SHARE_EMAIL__POSTGRES_TLS__SSLMODE: verify-full
      TINYCLOUD_QUOTA_URL: "${TINYCLOUD_QUOTA_URL}"
      TINYCLOUD_ADMIN_SECRET: "${TINYCLOUD_ADMIN_SECRET}"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_MAX_BLOCKING: "1024"

  dstack-ingress:
    image: ghcr.io/tinycloudlabs/tinycloud-node-ingress@sha256:63c1c44e2ded5b73a5f174807b91ca677826974df0f9ab3045f6ec87865a5744
    ports:
      - "443:443"
    depends_on:
      - tinycloud
    environment:
      - DOMAIN=tee.node.tinycloud.xyz
      - TARGET_ENDPOINT=http://tinycloud:8000
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # CNAME target the ingress publishes for DOMAIN. Must not start with `_`:
      # Android's resolver (bionic res_hnok) rejects a CNAME target whose first
      # label is `_`, so `_.<gateway>` is unresolvable on Android (TC-513).
      # `gateway.<gateway>` is the target Phala Cloud advertises (gateway.cname)
      # and upstream dstack-ingress documents; routing still uses SNI + the
      # _dstack-app-address TXT record, so TLS stays end-to-end into the CVM.
      - GATEWAY_DOMAIN=gateway.${DSTACK_GATEWAY_DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - SET_CAA=true
      - DNS_PROVIDER=cloudflare
      - CLIENT_MAX_BODY_SIZE=32m
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
    restart: unless-stopped
    # TC-959: only this service is labelled and shipped over loopback GELF.
    labels:
      tc.logship: "tinycloud-ingress"
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        labels: "tc.logship"
  # The dstack gateway's TLS-terminating routes (<app>-<port>.<domain>:443)
  # only forward to compose-published ports, so guest sshd on :22 is
  # unreachable via `phala ssh` even with authorized_keys installed.
  # Publish a TCP forwarder on 10022 that relays to guest sshd via the
  # docker host gateway. Port 10022 exposes ONLY sshd, which is key-gated.
  ssh-gateway:
    image: alpine/socat:1.8.1.3@sha256:188fe0a22182f81c16def9d1137930121eaa3023f427164e32c0d2f118f79dd6
    restart: unless-stopped
    ports:
      - "10022:10022"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: TCP-LISTEN:10022,fork,reuseaddr TCP:host.docker.internal:22
    # Only the node app and ingress ship logs. Keep this helper's logs local
    # and capped; Vector's own logs use the same exception below.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  vector:
    restart: unless-stopped
    image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    ports:
      - "127.0.0.1:12201:12201/udp"
    networks:
      logship:
        ipv4_address: 10.255.253.2
    tmpfs:
      - /var/lib/vector:rw,noexec,nosuid,size=8m,uid=10001,gid=10001,mode=0700
    environment:
      BETTERSTACK_SOURCE_TOKEN: "${BETTERSTACK_SOURCE_TOKEN:-}"
      BETTERSTACK_SOURCE_HOST: "${BETTERSTACK_SOURCE_HOST:-s2795437.us-west-2a.betterstackdata.com}"
      VECTOR_CONFIG_YAML: |
        data_dir: /var/lib/vector
        secret:
          bs: { type: directory, path: /var/lib/vector/secrets, remove_trailing_whitespace: true }
        sources:
          gelf_in:
            type: socket
            mode: udp
            address: 0.0.0.0:12201
            max_length: 262144
            framing: { method: chunked_gelf, chunked_gelf: { decompression: Auto } }
            decoding: { codec: gelf }
        transforms:
          logship_gate:
            type: remap
            inputs: [gelf_in]
            drop_on_error: true
            drop_on_abort: true
            source: |
              lbl = string(get(., ["_tc.logship"]) ?? null) ?? ""
              if lbl == "tinycloud-node" || lbl == "tinycloud-ingress" {
                .gate_action = "candidate"
                .gate_label = lbl
              } else if lbl == "" {
                . = {"gate_action": "drop", "gate_reason": "unlabelled"}
              } else {
                . = {"gate_action": "unexpected", "gate_reason": "unexpected_label"}
              }
          logship_gate_route:
            type: route
            inputs: [logship_gate]
            route:
              node: .gate_action == "candidate" && .gate_label == "tinycloud-node"
              ingress: .gate_action == "candidate" && .gate_label == "tinycloud-ingress"
              rejected: .gate_action == "drop" || .gate_action == "unexpected"
          strip_gelf_fields:
            type: remap
            inputs: [logship_gate_route.node, logship_gate_route.ingress]
            drop_on_error: true
            drop_on_abort: true
            source: |
              label = .gate_label
              raw = get(., ["message"]) ?? null
              if !is_string(raw) {
                . = {"gate_action": "drop", "gate_reason": "malformed_envelope"}
              } else {
                tag = if label == "tinycloud-node" { "tinycloud.node" } else { "tinycloud.ingress" }
                . = {"gate_action": "candidate", "gate_label": label, "tag": tag, "message": raw}
              }
          parse_gelf_message:
            type: remap
            inputs: [strip_gelf_fields]
            drop_on_error: true
            drop_on_abort: true
            source: |
              if .gate_action == "drop" {
                reason = .gate_reason
                . = {"gate_action": "drop", "gate_reason": reason}
              } else {
                parsed, parse_err = parse_json(.message)
                if parse_err != null || !is_object(parsed) {
                  . = {"gate_action": "drop", "gate_reason": "malformed_envelope"}
                } else {
                  tag = .tag
                  raw = .message
                  . = {"tag": tag, "log": raw, "parsed_log": parsed}
                }
              }
          logship_inner:
            type: remap
            inputs: [parse_gelf_message]
            drop_on_error: true
            drop_on_abort: true
            source: |
              if exists(.gate_action) {
                action = .gate_action
                reason = .gate_reason
                . = {"gate_action": action, "gate_reason": reason}
              } else if !is_string(.log) {
                . = {"gate_action": "drop", "gate_reason": "malformed_envelope"}
              } else {
                raw = .log
                parsed = .parsed_log
                if !is_object(parsed) || exists(parsed.partial_message) {
                  . = {"gate_action": "drop", "gate_reason": "malformed_envelope"}
                } else if .tag == "tinycloud.node" {
                  fields = get(parsed, ["fields"]) ?? null
                  message = if is_object(fields) { get(fields, ["message"]) ?? null } else { null }
                  if !is_string(message) {
                    . = {"gate_action": "drop", "gate_reason": "malformed_envelope"}
                  } else {
                    message = to_string(message) ?? ""
                    known_message = includes([
                      "invocation replay insert failed",
                      "invocation replay cleanup failed",
                      "share-v2 local-tee feature active: deriving a deterministic, non-attested TEE identity from node key material",
                      "retention: delivered hook delivery prune failed",
                      "retention: dead-letter hook delivery prune failed",
                      "retention: signed KV ticket prune failed",
                      "failed to load tunnel state; tunnel not started",
                      "invalid loopback API address; tunnel not started",
                      "failed to load link state; LAN listener not started",
                      "failed to bind link LAN listener; LAN listener not started",
                      "failed to build TLS config; LAN listener not started",
                      "link LAN listener exited with error",
                      "failed to record link listener bind state",
                      "failed to record link listener bind failure",
                      "failed to load config for auto-renew",
                      "link auto-renew failed",
                      "failed to hot-reload renewed link cert",
                      "failed to reload TLS material after link auto-renew",
                      "link disable: service delete failed; local state removed anyway",
                      "link connection error",
                      "link listener accept error",
                      "webhook delivery attempt failed",
                      "webhook dispatcher loop failed",
                      "addressed delegation authorization failed",
                      "native share authorization denied",
                      "native share KV put failed",
                      "share v2 readiness probe failed",
                      "share v2 is enabled but shareEmail.invitationPublicKey is unset",
                      "configured share invitation key does not match the node's derived signing key",
                      "share/v2 policy challenge denied",
                      "failed to read committed hook events",
                      "failed to load kv write hook rows",
                      "failed to load kv delete hook rows",
                      "missing committed kv hook row for invocation",
                      "database write committed but webhook enqueue failed",
                      "tunnel: failed to prepare connection attempt",
                      "tunnel: no frame within idle timeout; treating connection as dead",
                      "tunnel: read error",
                      "tunnel: dropping malformed frame",
                      "tunnel: relay sent an error frame",
                      "tunnel: failed to write frame",
                      "tunnel: failed to record runtime state",
                      "tunnel: failed to clear runtime state after disable",
                      "tunnel authentication rejected",
                      "node fatal panic"
                    ], message)
                    if !known_message {
                      known_message = starts_with(message, "dstack socket available but get_info failed: ") ||
                        starts_with(message, "quota service returned an invalid body: ") ||
                        starts_with(message, "quota service returned ") ||
                        starts_with(message, "Failed to get TDX quote: ")
                    }
                    if !known_message {
                      . = {"gate_action": "drop", "gate_reason": "unknown_message"}
                    } else {
                      . = {"tag": .tag, "log": raw, "parsed_log": parsed}
                    }
                  }
                } else if .tag == "tinycloud.ingress" {
                  . = {"tag": .tag, "log": raw, "parsed_log": parsed}
                } else {
                  . = {"gate_action": "drop", "gate_reason": "unexpected_label"}
                }
              }
          logship_result_route:
            type: route
            inputs: [logship_gate_route.rejected, logship_inner]
            route:
              dropped: .gate_action == "drop"
              unexpected: .gate_action == "unexpected"
              validated: is_string(.tag) && is_string(.log)
          logship_drop_counter:
            type: remap
            inputs: [logship_result_route.dropped]
            drop_on_error: true
            drop_on_abort: true
            source: |
              reason = .gate_reason
              if !includes(["malformed_envelope", "unknown_message", "unlabelled"], reason) { abort }
              minute = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M")
              . = {"minute": minute, "reason": reason, "count": 1}
          logship_unexpected_counter:
            type: remap
            inputs: [logship_result_route.unexpected]
            drop_on_error: true
            drop_on_abort: true
            source: |
              minute = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M")
              . = {"minute": minute, "reason": "unexpected_label", "count": 1}
          logship_summary_input:
            type: remap
            inputs: [logship_drop_counter, logship_unexpected_counter]
            drop_on_error: true
            drop_on_abort: true
            source: |
              reason = .reason
              minute = .minute
              count = .count
              if !is_string(reason) || !is_string(minute) { abort }
              if !includes(["malformed_envelope", "unexpected_label", "unknown_message", "unlabelled"], reason) { abort }
              if !is_integer(count) { abort }
              count = to_int(count) ?? 0
              if count < 1 || count > 1000000000 { abort }
              . = {
                "minute": .minute,
                "malformed_envelope_count": 0,
                "unknown_message_count": 0,
                "unlabelled_count": 0,
                "unexpected_label_count": 0
              }
              if reason == "malformed_envelope" { .malformed_envelope_count = count }
              else if reason == "unknown_message" { .unknown_message_count = count }
              else if reason == "unlabelled" { .unlabelled_count = count }
              else { .unexpected_label_count = count }
          logship_counter_reduce:
            type: reduce
            inputs: [logship_summary_input]
            group_by: [minute]
            expire_after_ms: 75000
            end_every_period_ms: 60000
            flush_period_ms: 1000
            merge_strategies:
              malformed_envelope_count: sum
              unknown_message_count: sum
              unlabelled_count: sum
              unexpected_label_count: sum
          logship_counter_output:
            type: remap
            inputs: [logship_counter_reduce]
            drop_on_error: true
            drop_on_abort: true
            source: |
              malformed = .malformed_envelope_count
              unknown = .unknown_message_count
              unlabelled = .unlabelled_count
              unexpected = .unexpected_label_count
              if !is_integer(malformed) || !is_integer(unknown) || !is_integer(unlabelled) || !is_integer(unexpected) { abort }
              malformed = to_int(malformed) ?? 0
              unknown = to_int(unknown) ?? 0
              unlabelled = to_int(unlabelled) ?? 0
              unexpected = to_int(unexpected) ?? 0
              if malformed < 0 || malformed > 1000000000 || unknown < 0 || unknown > 1000000000 || unlabelled < 0 || unlabelled > 1000000000 || unexpected < 0 || unexpected > 1000000000 { abort }
              if malformed + unknown + unlabelled + unexpected < 1 { abort }
              . = {
                "level": "warn",
                "ts": format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.3fZ"),
                "event": "logship_gate_summary_total",
                "svc": "logship",
                "malformed_envelope_count": malformed,
                "unknown_message_count": unknown,
                "unlabelled_count": unlabelled,
                "unexpected_label_count": unexpected
              }
          allowlist:
            type: remap
            inputs: [logship_result_route.validated]
            drop_on_abort: true
            drop_on_error: true
            source: |
              # BEGIN GENERATED FROM fields.json
              if exists(.partial_message) { abort }
              if !is_string(.tag) { abort }
              tag = .tag
              j = null
              if exists(.parsed_log) {
                j = .parsed_log
                if !is_object(j) { abort }
              } else {
                if !is_string(.log) { abort }
                j, parse_err = parse_json(.log)
                if parse_err != null || !is_object(j) { abort }
              }
              out = {}
              if tag == "tinycloud.node" {
                fields = get(j, ["fields"]) ?? null
                if !is_object(fields) { abort }
                level = get(j, ["level"]) ?? null
                if !is_string(level) { abort }
                level = downcase(level) ?? ""
                if !includes(["warn", "error"], level) { abort }
                msg = get(fields, ["message"]) ?? null
                if !is_string(msg) { abort }
                msg = to_string(msg) ?? ""
                event = null
                event_code = null
                if msg == "invocation replay insert failed" { event = "node_warning"; event_code = "invocation_replay_insert_failed" }
                else if msg == "invocation replay cleanup failed" { event = "node_warning"; event_code = "invocation_replay_cleanup_failed" }
                else if starts_with(msg, "dstack socket available but get_info failed: ") { event = "node_warning"; event_code = "dstack_get_info_failed" }
                else if msg == "share-v2 local-tee feature active: deriving a deterministic, non-attested TEE identity from node key material" { event = "node_warning"; event_code = "share_local_tee_identity" }
                else if msg == "retention: delivered hook delivery prune failed" { event = "node_warning"; event_code = "retention_hook_delivery_prune_failed" }
                else if msg == "retention: dead-letter hook delivery prune failed" { event = "node_warning"; event_code = "retention_dead_letter_prune_failed" }
                else if msg == "retention: signed KV ticket prune failed" { event = "node_warning"; event_code = "retention_signed_ticket_prune_failed" }
                else if starts_with(msg, "quota service returned an invalid body: ") { event = "node_warning"; event_code = "quota_invalid_body" }
                else if starts_with(msg, "quota service returned ") { event = "node_warning"; event_code = "quota_fallback" }
                else if msg == "failed to load tunnel state; tunnel not started" { event = "node_warning"; event_code = "tunnel_state_load_failed" }
                else if msg == "invalid loopback API address; tunnel not started" { event = "node_warning"; event_code = "tunnel_address_invalid" }
                else if msg == "failed to load link state; LAN listener not started" { event = "node_warning"; event_code = "link_state_load_failed" }
                else if msg == "failed to bind link LAN listener; LAN listener not started" { event = "node_warning"; event_code = "link_bind_failed" }
                else if msg == "failed to build TLS config; LAN listener not started" { event = "node_warning"; event_code = "link_tls_config_failed" }
                else if msg == "link LAN listener exited with error" { event = "node_error"; event_code = "link_listener_error" }
                else if msg == "failed to record link listener bind state" { event = "node_warning"; event_code = "link_listener_state_write_failed" }
                else if msg == "failed to record link listener bind failure" { event = "node_warning"; event_code = "link_bind_state_write_failed" }
                else if msg == "failed to load config for auto-renew" { event = "node_warning"; event_code = "link_auto_renew_config_failed" }
                else if msg == "link auto-renew failed" { event = "node_warning"; event_code = "link_auto_renew_failed" }
                else if msg == "failed to hot-reload renewed link cert" { event = "node_warning"; event_code = "link_cert_reload_failed" }
                else if msg == "failed to reload TLS material after link auto-renew" { event = "node_warning"; event_code = "link_listener_cert_reload_failed" }
                else if msg == "link disable: service delete failed; local state removed anyway" { event = "node_warning"; event_code = "link_disable_failed" }
                else if msg == "link connection error" { event = "node_warning"; event_code = "link_connection_error" }
                else if msg == "link listener accept error" { event = "node_warning"; event_code = "link_listener_accept_failed" }
                else if msg == "webhook delivery attempt failed" { event = "node_warning"; event_code = "webhook_delivery_failed" }
                else if msg == "webhook dispatcher loop failed" { event = "node_warning"; event_code = "webhook_dispatcher_failed" }
                else if msg == "addressed delegation authorization failed" { event = "node_error"; event_code = "share_authorization_failed" }
                else if msg == "native share authorization denied" { event = "node_error"; event_code = "share_native_authorization_denied" }
                else if msg == "native share KV put failed" { event = "node_error"; event_code = "share_native_kv_put_failed" }
                else if msg == "share v2 readiness probe failed" { event = "node_error"; event_code = "share_v2_readiness_failed" }
                else if msg == "share v2 is enabled but shareEmail.invitationPublicKey is unset" { event = "node_error"; event_code = "share_invitation_key_missing" }
                else if msg == "configured share invitation key does not match the node's derived signing key" { event = "node_error"; event_code = "share_invitation_key_mismatch" }
                else if msg == "share/v2 policy challenge denied" { event = "node_warning"; event_code = "share_policy_denied" }
                else if starts_with(msg, "Failed to get TDX quote: ") { event = "node_error"; event_code = "attestation_quote_failed" }
                else if msg == "failed to read committed hook events" { event = "node_warning"; event_code = "hook_events_read_failed" }
                else if msg == "failed to load kv write hook rows" { event = "node_warning"; event_code = "hook_rows_load_failed" }
                else if msg == "failed to load kv delete hook rows" { event = "node_warning"; event_code = "hook_rows_load_failed" }
                else if msg == "missing committed kv hook row for invocation" { event = "node_warning"; event_code = "missing_committed_hook_row" }
                else if msg == "database write committed but webhook enqueue failed" { event = "node_warning"; event_code = "webhook_enqueue_failed" }
                else if msg == "tunnel: failed to prepare connection attempt" { event = "node_warning"; event_code = "tunnel_connection_prepare_failed" }
                else if msg == "tunnel: no frame within idle timeout; treating connection as dead" { event = "node_warning"; event_code = "tunnel_idle_timeout" }
                else if msg == "tunnel: read error" { event = "node_warning"; event_code = "tunnel_read_failed" }
                else if msg == "tunnel: dropping malformed frame" { event = "node_warning"; event_code = "tunnel_malformed_frame" }
                else if msg == "tunnel: relay sent an error frame" { event = "node_warning"; event_code = "tunnel_relay_error" }
                else if msg == "tunnel: failed to write frame" { event = "node_warning"; event_code = "tunnel_write_failed" }
                else if msg == "tunnel: failed to record runtime state" { event = "node_warning"; event_code = "tunnel_state_record_failed" }
                else if msg == "tunnel: failed to clear runtime state after disable" { event = "node_warning"; event_code = "tunnel_state_clear_failed" }
                else if msg == "tunnel authentication rejected" { event = "node_warning"; event_code = "tunnel_auth_rejected" }
                else if msg == "node fatal panic" { event = "node_fatal_panic"; event_code = "other" }
                else { abort }
                if event == "node_warning" && level != "warn" { abort }
                if (event == "node_error" || event == "node_fatal_panic") && level != "error" { abort }
                level = if event == "node_warning" { "warn" } else { "error" }
                out.svc = "api"
                out.level = level
                out.event = event
                out.event_code = event_code
                ts = get(j, ["timestamp"]) ?? null
                if !is_string(ts) { abort }
                parsed_ts, time_err = parse_timestamp(ts, format: "%+")
                if time_err != null { abort }
                out.ts = format_timestamp!(parsed_ts, format: "%Y-%m-%dT%H:%M:%S%.3fZ")
              } else if tag == "tinycloud.ingress" {
                out.svc = "ingress"
                ts = get(j, ["time"]) ?? null
                if !is_string(ts) { abort }
                parsed_ts, time_err = parse_timestamp(ts, format: "%+")
                if time_err != null { abort }
                out.ts = format_timestamp!(parsed_ts, format: "%Y-%m-%dT%H:%M:%S%.3fZ")
                route = get(j, ["route"]) ?? null
                if !is_string(route) { abort }
                route = to_string(route) ?? ""
                if length(route) > 256 { abort }
                if !includes(["/healthz","/info","/version","/invoke","/delegate","/revoke","/attestation","/signed/kv","/signed/kv/<ticket_id>","/admin/quota","/admin/quota/<space_id>","/admin/usage","/hooks/events","/hooks/tickets","/hooks/webhooks","/hooks/webhooks/<subscription_id>","/delegation/query","/delegation/status","/encryption/networks","/encryption/networks/<network_id>","/encryption/networks/<network_id>/revoke","/encryption/networks/<network_id>/decrypt","/policy/v3/status","/policy/v3/status/<root_cid>","/policy/v3/policies","/policy/v3/challenges","/policy/v3/delegations","/policy/v3/enforcer-bindings","/policy/v3/deliveries/authorize","/.well-known/tinycloud/node-keys","/.well-known/encryption/network/<name>","/public/<space_id>/kv","/public/<space_id>/kv/<key..>","/peer/generate/<space>","/evidences/<file>"], route) { route = "<unmatched>" }
                if !is_string(route) { abort }
                if !includes(["/healthz","/info","/version","/invoke","/delegate","/revoke","/attestation","/signed/kv","/signed/kv/<ticket_id>","/admin/quota","/admin/quota/<space_id>","/admin/usage","/hooks/events","/hooks/tickets","/hooks/webhooks","/hooks/webhooks/<subscription_id>","/delegation/query","/delegation/status","/encryption/networks","/encryption/networks/<network_id>","/encryption/networks/<network_id>/revoke","/encryption/networks/<network_id>/decrypt","/policy/v3/status","/policy/v3/status/<root_cid>","/policy/v3/policies","/policy/v3/challenges","/policy/v3/delegations","/policy/v3/enforcer-bindings","/policy/v3/deliveries/authorize","/.well-known/tinycloud/node-keys","/.well-known/encryption/network/<name>","/public/<space_id>/kv","/public/<space_id>/kv/<key..>","/peer/generate/<space>","/evidences/<file>","<unmatched>"], route) { abort }
                out.route = route
                method = get(j, ["method"]) ?? null
                if !is_string(method) { abort }
                if !includes(["GET","HEAD","POST","PUT","PATCH","DELETE","OPTIONS","<other>"], method) { abort }
                out.method = method
                status = get(j, ["status"]) ?? null
                if !is_integer(status) { abort }
                status = to_int(status) ?? 0
                if status < 100 || status > 599 { abort }
                out.status = status
                bytes = get(j, ["bytes"]) ?? null
                if !is_integer(bytes) { abort }
                bytes = to_int(bytes) ?? 0
                if bytes < 0 || bytes > 1000000000 { abort }
                out.bytes_sent = bytes
                upstream_status_raw = "-"
                if exists(j.upstream_status) { upstream_status_raw = j.upstream_status }
                if !is_string(upstream_status_raw) { abort }
                upstream_status_raw = to_string(upstream_status_raw) ?? ""
                if length(upstream_status_raw) > 63 { abort }
                upstream_status = ""
                if upstream_status_raw != "-" && upstream_status_raw != "" {
                  if !match(upstream_status_raw, r'^[1-5][0-9]{2}(, ?[1-5][0-9]{2}| : [1-5][0-9]{2})*$$') { abort }
                  upstream_status = slice!(upstream_status_raw, 0, 3)
                }
                if !is_string(upstream_status) { abort }
                if length(upstream_status) > 3 { abort }
                if !match(upstream_status, r'^(|[1-5][0-9]{2})$$') { abort }
                out.upstream_status = upstream_status
                request_time = get(j, ["request_time"]) ?? null
                if !(is_integer(request_time) || is_float(request_time)) { abort }
                request_time = to_float(request_time) ?? 0.0
                if request_time < 0 || request_time > 86400 { abort }
                out.request_time_seconds = request_time
                status_class = if status >= 500 { "5xx" } else if status >= 400 { "4xx" } else if status >= 300 { "3xx" } else if status >= 200 { "2xx" } else { "1xx" }
                out.status_class = status_class
                if status >= 400 { out.level = if status >= 500 { "error" } else { "warn" }; out.event = "ingress_failure_count"; out.request_count = 1 }
                else if status >= 200 && status < 300 { out.level = "info"; out.event = "ingress_success_count"; out.request_count = 1 }
                else if request_time >= 1 { out.level = "warn"; out.event = "ingress_request_slow" }
                else { abort }
              } else { abort }
              . = out
              # END GENERATED FROM fields.json
          classify_by_budget:
            type: route
            inputs: [allowlist, logship_counter_output]
            route:
              panic: .event == "node_fatal_panic"
              app_error: .event == "node_error"
              app_warning: .event == "node_warning"
              logship_summary: .event == "logship_gate_summary_total"
              ingress_summary: .event == "ingress_failure_count" || .event == "ingress_success_count"
              ingress_slow: .event == "ingress_request_slow"
          split_requests:
            type: route
            inputs: [classify_by_budget.ingress_summary]
            route:
              aggregate: .event == "ingress_failure_count" || .event == "ingress_success_count"
              slow_success: .event == "ingress_success_count" && (to_float(.request_time_seconds) ?? 0.0) >= 1.0
          slow_success:
            type: remap
            inputs: [split_requests.slow_success]
            drop_on_error: true
            source: |
              . = {
                "level": "warn",
                "ts": .ts,
                "event": "ingress_request_slow",
                "svc": "ingress",
                "route": .route,
                "method": .method,
                "status": .status,
                "status_class": .status_class,
                "request_time_seconds": .request_time_seconds,
                "bytes_sent": .bytes_sent,
                "upstream_status": .upstream_status
              }
          request_minute:
            type: remap
            inputs: [split_requests.aggregate]
            drop_on_error: true
            source: |
              minute = slice!(.ts, 0, 16)
              . = {
                "route": .route,
                "status_class": .status_class,
                "event": .event,
                "minute": minute,
                "request_count": .request_count
              }
          request_reduce:
            type: reduce
            inputs: [request_minute]
            group_by: [route, status_class, event, minute]
            expire_after_ms: 75000
            end_every_period_ms: 60000
            flush_period_ms: 1000
            merge_strategies:
              request_count: sum
          request_output:
            type: remap
            inputs: [request_reduce]
            drop_on_error: true
            drop_on_abort: true
            source: |
              route = .route
              status_class = .status_class
              event = .event
              count = .request_count
              if !is_integer(count) { abort }
              count = to_int!(count)
              if count < 1 || count > 1000000 { abort }
              level = null
              if event == "ingress_success_count" && status_class == "2xx" { level = "info" }
              else if event == "ingress_failure_count" && includes(["4xx", "5xx"], status_class) {
                level = if status_class == "5xx" { "error" } else { "warn" }
              } else { abort }
              . = {
                "level": level,
                "ts": format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.3fZ"),
                "event": event,
                "svc": "ingress",
                "route": route,
                "status_class": status_class,
                "request_count": count
              }
          throttle_panic:
            type: throttle
            inputs: [classify_by_budget.panic]
            window_secs: 60
            threshold: 2
          throttle_app_error:
            type: throttle
            inputs: [classify_by_budget.app_error]
            window_secs: 60
            threshold: 5
          throttle_app_warning:
            type: throttle
            inputs: [classify_by_budget.app_warning]
            window_secs: 60
            threshold: 5
          throttle_logship_summary:
            type: throttle
            inputs: [classify_by_budget.logship_summary]
            window_secs: 60
            threshold: 1
          throttle_ingress:
            type: throttle
            inputs: [request_output, classify_by_budget.ingress_slow, slow_success]
            window_secs: 60
            threshold: 26
          budget_size_guard:
            type: remap
            inputs: [throttle_panic, throttle_app_error, throttle_app_warning, throttle_logship_summary, throttle_ingress]
            drop_on_error: true
            drop_on_abort: true
            source: |
              if length(encode_json(.)) > 280 { abort }
        sinks:
          betterstack:
            type: http
            inputs: [budget_size_guard]
            method: post
            uri: "https://betterstack-placeholder.invalid/"
            encoding: { codec: json }
            compression: gzip
            auth: { strategy: bearer, token: "SECRET[bs.bs_token]" }
            batch: { max_bytes: 4000000, timeout_secs: 5 }
            buffer: { type: memory, max_events: 1000, when_full: drop_newest }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /var/lib/vector/secrets
        if [ -z "$${BETTERSTACK_SOURCE_TOKEN}" ]; then
          rm -f /var/lib/vector/secrets/bs_token
          printf '%s\n' 'Better Stack token is absent; Vector is idle'
          while :; do sleep 3600; done
        fi
        case "$${BETTERSTACK_SOURCE_HOST}" in
          ''|*[!A-Za-z0-9.-]*) printf '%s\n' 'invalid Better Stack host' >&2; exit 1 ;;
        esac
        printf '%s' "$${BETTERSTACK_SOURCE_TOKEN}" > /var/lib/vector/secrets/bs_token
        printf '%s' "$${VECTOR_CONFIG_YAML}" | sed "s/betterstack-placeholder.invalid/$${BETTERSTACK_SOURCE_HOST}/g" > /var/lib/vector/runtime.yaml
        unset BETTERSTACK_SOURCE_TOKEN BETTERSTACK_SOURCE_HOST VECTOR_CONFIG_YAML
        exec vector --config /var/lib/vector/runtime.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  cert-data:

networks:
  logship:
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.253.0/28
