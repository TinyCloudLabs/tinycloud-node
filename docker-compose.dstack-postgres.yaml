# dstack deployment - Topology 2: Postgres + S3
# tinycloud-node in the CVM, Postgres external.
# Database credentials encrypted by dstack KMS.
# Column encryption enabled for sensitive data.
#
# All ${...} variables should be encrypted using dstack's KMS public key
# before deployment. The operator never sees plaintext values.

services:
  tinycloud:
    # N0: unchanged production 1.20.6 binary; this is not a new app release.
    image: ghcr.io/tinycloudlabs/tinycloud-node@sha256:4bdae4fc232d886bb56bfbce4ec62ed4b8fb4e1369a01f6afb73d06dd68c188f
    restart: unless-stopped
    labels:
      tc.logship: tinycloud-node
    # Host Docker daemon sends GELF; the app never joins Vector's network.
    # Nonblocking UDP can lose logs. No raw Docker cache or /logs fallback.
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        gelf-compression-type: none
        labels: tc.logship
        mode: non-blocking
        max-buffer-size: 4m
        cache-disabled: "true"
    ports:
      - "8000:8000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - deletion-ledger:/var/lib/tinycloud/ledger
    environment:
      # TC-3554: the node keeps its pre-move root and identity (KMS root epoch
      # 0, docs/tc-3554-kms-epoch-fetch.md). It opens that root from the
      # database's root_wrap blob and checks it against these pins before any
      # other database write. The blob is sealed under the current root by a
      # boot of a root_wrap release on the sidecar compose (1.26.14's). This
      # compose has no sidecar and no transport, so with no blob it refuses to
      # start: DEPLOY ONLY AFTER A BLOB EXISTS IN PROD. Every pin is a literal
      # so the compose hash attests it.
      TINYCLOUD_KEYS__TYPE: DstackKmsEpoch
      TINYCLOUD_KEYS__LEGACY__ROOT_EPOCH: "0"
      TINYCLOUD_KEYS__LEGACY__KMS_ROOT_PUBKEY: 0334c76e0c3f52ec64cbf9bbf5c910c272330166fd656c0a86bb330963e46910e1
      TINYCLOUD_KEYS__LEGACY__APP_ID: 350d124c81d53a57e8899e9f85a904918e663b61
      TINYCLOUD_KEYS__LEGACY__EXPECTED_DID: did:key:z6MkjHi79SMX4doJyo2w7jDTM6Fa7iX6EVZWXNbJ6RzBm3Wi
      TINYCLOUD_KEYS__EXPECTED_NODE_DID: did:key:z6MkjHi79SMX4doJyo2w7jDTM6Fa7iX6EVZWXNbJ6RzBm3Wi
      TINYCLOUD_STORAGE_DATABASE: "${DATABASE_URL}"
      TINYCLOUD_STORAGE_BLOCKS_TYPE: S3
      TINYCLOUD_STORAGE_BLOCKS_BUCKET: "${S3_BUCKET}"
      TINYCLOUD_STORAGE_BLOCKS_ENDPOINT: "${S3_ENDPOINT}"
      AWS_ACCESS_KEY_ID: "${AWS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET}"
      AWS_DEFAULT_REGION: "${AWS_REGION}"
      TINYCLOUD_LOG_LEVEL: normal
      TINYCLOUD_LOG__FORMAT: Json
      # Enable Prometheus telemetry (metrics, span histograms, pool gauges).
      # The metrics handler is intentionally NOT gateway-exposed: port 8001 is
      # not published here, so the unauthenticated /metrics endpoint stays
      # internal to the CVM.
      TINYCLOUD_TELEMETRY__ENABLED: "true"
      # The managed Postgres instance allows max_connections = 25 (measured
      # 2026-07-29, with some of those reserved for superuser roles). The pool
      # default of 100 cannot be satisfied: the node opened and held slots
      # until the instance ran out, and further requests failed with
      # "Failed to acquire connection from pool: Connection pool timed out"
      # after the 30s sqlx default. Keep this below the instance limit with
      # headroom for admin/psql access, and raise it only alongside the
      # instance's own max_connections.
      # TC-950: 10, so two containers that overlap during a deploy (2 x 10)
      # fit in the instance limit with room for admin access.
      TINYCLOUD_DATABASE__MAX_CONNECTIONS: "10"
      # TC-1491: load stored SQL databases up to 320 MiB again. Hydration
      # streams 4 MiB slices to the cache file, so node memory stays one
      # slice. The 64 MiB save limit (max_artifact_write_bytes) is unchanged:
      # a write that needs a whole checkpoint over it still answers 507.
      TINYCLOUD_STORAGE__SQL__MAX_ARTIFACT_READ_BYTES: "320 MiB"
      # TC-1491: cap each stored SQL database at 320 MiB, the same as the read
      # limit above, so a database can always be loaded again. A write that
      # would grow a database past it answers 507 sql_database_size_limit; a
      # database already over it still takes writes that do not grow it. Keep
      # 1 GiB of the data volume free: a write that would eat into it answers
      # 507 sql_disk_headroom.
      TINYCLOUD_STORAGE__SQL__MAX_DATABASE_BYTES: "320 MiB"
      TINYCLOUD_STORAGE__SQL__MIN_FREE_BYTES: "1 GiB"
      # TC-1791: enforce the tables / columns / readOnly caveats of delegated
      # SQL grants. Off, such a grant is refused at /delegate, so no stored
      # chain carries them and un-caveated SQL is unchanged.
      TINYCLOUD_SQL__DELEGATED_CAVEATS_ENFORCED: "true"
      # TC-1274: production boots with the epoch_head backfill off while the
      # database is CPU-bound. Writes stay correct without it. Re-enable later
      # by setting "true" (or removing this line); the pace keys are
      # TINYCLOUD_EPOCH_HEAD_BACKFILL__SPACES_PER_SECOND / __PROGRESS_EVERY.
      # Keep the double underscore: a single underscore is silently ignored.
      TINYCLOUD_EPOCH_HEAD_BACKFILL__ENABLED: "false"
      # Required for every manual TC-780 deploy. Keep true through offline
      # verification; only the final, explicitly reviewed redeploy sets false.
      TINYCLOUD_DATABASE__WRITE_FENCE: "${SQL_IDENTITY_FENCE:?set true during cutover, false after verification}"
      TINYCLOUD_CORS: "true"
      # TC-287: the retention sweeper prunes delivered hook deliveries after
      # 7 days, dead-letter ones after 30 days and signed KV tickets 7 days
      # after they expire, in batches of 5000, at boot and every 5 minutes.
      # Deleted rows do not come back; remove this line to stop it.
      TINYCLOUD_RETENTION__ENABLED: "true"
      # --- addressed sharing (TC-397) ------------------------------------
      #
      # The public trust document shared with Share and OpenCredentials,
      # delivered inline because nothing else can reach this container: the
      # image is `FROM scratch` (no shell, so share-api's decode-to-tmpfs
      # entrypoint cannot work here) and a dstack deployment uploads only
      # this compose file (so there is no host path to bind-mount from).
      #
      # Seal the base64 of the reviewed trust-bundle.production.json — the
      # same bytes share-api serves — into the CVM's encrypted environment as
      # SHARE_TRUST_BUNDLE_BASE64. Same variable name and same wire form
      # share-api already uses, so one sealed value feeds both services and
      # cannot drift between them.
      #
      # The `:?` form is deliberate: compose refuses to interpolate a partial
      # deployment, failing loudly at deploy time rather than letting the node
      # die at boot with "share email trust bundle is required".
      TINYCLOUD_SHARE_EMAIL__ENABLED: "true"
      TINYCLOUD_SHARE_EMAIL__TRUST_BUNDLE_BASE64: "${SHARE_TRUST_BUNDLE_BASE64:?seal the reviewed share-email trust bundle, base64-encoded}"
      # The sealed DATABASE_URL already carries sslmode=verify-full as its sole
      # query parameter. ROOT_CERT_PATH stays unset so verify-full resolves
      # against the compiled-in public root set (TC-363).
      TINYCLOUD_SHARE_EMAIL__POSTGRES_TLS__SSLMODE: verify-full
      TINYCLOUD_QUOTA_URL: "${TINYCLOUD_QUOTA_URL}"
      TINYCLOUD_ADMIN_SECRET: "${TINYCLOUD_ADMIN_SECRET}"
      NODE_STATS_READ_TOKEN: "${NODE_STATS_READ_TOKEN:-}"
      # TC-1777: named-keys release gate. Set by the docker.yml named_keys_v1
      # workflow input (default false); never hand-edit the CVM env.
      TINYCLOUD_ENCRYPTION_NETWORK__NAMED_KEYS_V1: "${NAMED_KEYS_V1:-false}"
      # Append-only record of deleted keys, on the deletion-ledger volume so it
      # survives container replacement. Required by the node while the gate is on.
      TINYCLOUD_ENCRYPTION_NETWORK__DELETION_LEDGER_PATH: /var/lib/tinycloud/ledger/deletions.jsonl
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_MAX_BLOCKING: "1024"

  dstack-ingress:
    image: ghcr.io/tinycloudlabs/tinycloud-node-ingress@sha256:7e5dc37a04ad45a900b5da2761368ddad28b2c126a7240e1f50a813e2e875e9d
    ports:
      - "443:443"
    depends_on:
      - tinycloud
    environment:
      - DOMAIN=tee.node.tinycloud.xyz
      - TARGET_ENDPOINT=http://tinycloud:8000
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # CNAME target the ingress publishes for DOMAIN. Must not start with `_`:
      # Android's resolver (bionic res_hnok) rejects a CNAME target whose first
      # label is `_`, so `_.<gateway>` is unresolvable on Android (TC-513).
      # `gateway.<gateway>` is the target Phala Cloud advertises (gateway.cname)
      # and upstream dstack-ingress documents; routing still uses SNI + the
      # _dstack-app-address TXT record, so TLS stays end-to-end into the CVM.
      - GATEWAY_DOMAIN=gateway.${DSTACK_GATEWAY_DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - SET_CAA=true
      - DNS_PROVIDER=cloudflare
      - CLIENT_MAX_BODY_SIZE=95m
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
    restart: unless-stopped
    labels:
      tc.logship: tinycloud-ingress
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        gelf-compression-type: none
        labels: tc.logship
        mode: non-blocking
        max-buffer-size: 4m
        cache-disabled: "true"

  # The dstack gateway's TLS-terminating routes (<app>-<port>.<domain>:443)
  # only forward to compose-published ports, so guest sshd on :22 is
  # unreachable via `phala ssh` even with authorized_keys installed.
  # Publish a TCP forwarder on 10022 that relays to guest sshd via the
  # docker host gateway. Port 10022 exposes ONLY sshd, which is key-gated.
  ssh-gateway:
    image: alpine/socat:1.8.1.3@sha256:188fe0a22182f81c16def9d1137930121eaa3023f427164e32c0d2f118f79dd6
    restart: unless-stopped
    ports:
      - "10022:10022"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: TCP-LISTEN:10022,fork,reuseaddr TCP:host.docker.internal:22

  vector:
    restart: unless-stopped
    image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
    init: true
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    ports:
    - 127.0.0.1:12201:12201/udp
    networks:
    - logship
    tmpfs:
    - /var/lib/vector:rw,noexec,nosuid,size=8m,uid=10001,gid=10001,mode=0700
    environment:
      TINYCLOUD_LOGSHIP_PROFILE: ${TINYCLOUD_LOGSHIP_PROFILE:-errors_slow}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:?seal the node source token before enabling log shipping}
      VECTOR_CONFIG_JSON: "{\"data_dir\":\"/var/lib/vector\",\"sources\":{\"gelf_in\":{\"type\":\"socket\",\"mode\":\"udp\",\"address\":\"0.0.0.0:12201\",\"max_length\":262144,\"receive_buffer_bytes\":8388608,\"framing\":{\"method\":\"chunked_gelf\",\"chunked_gelf\":{\"decompression\":\"Auto\"}},\"decoding\":{\"codec\":\"bytes\"}}},\"transforms\":{\"gelf_envelope\":{\"type\":\"remap\",\"inputs\":[\"gelf_in\"],\"source\":\"packet = string(.message) ?? \\\"\\\"\\nif length(packet) > 262144 {\\n  . = {\\\"reason\\\": \\\"oversized\\\"}\\n} else {\\n  outer, err = parse_json(packet)\\n  if err != null || !is_object(outer) || (outer.version != \\\"1.1\\\" && outer.version != \\\"1.0\\\") {\\n    . = {\\\"reason\\\": \\\"malformed_envelope\\\"}\\n  } else if exists(outer.partial_message) || exists(outer._partial_message) {\\n    . = {\\\"reason\\\": \\\"partial\\\"}\\n  } else {\\n    label = get(outer, [\\\"_tc.logship\\\"]) ?? null\\n    . = {\\\"_tc.logship\\\": label, \\\"message\\\": outer.short_message}\\n  }\\n}\",\"drop_on_error\":true,\"drop_on_abort\":true},\"logship_gate\":{\"type\":\"remap\",\"inputs\":[\"gelf_envelope\"],\"source\":\"if exists(.reason) {\\n  . = {\\\"reason\\\": .reason}\\n} else {\\nlabel = string(get(., [\\\"_tc.logship\\\"]) ?? null) ?? \\\"\\\"\\nraw = .message\\nreason = \\\"\\\"\\nif label == \\\"\\\" { reason = \\\"unlabelled\\\" }\\nelse if !includes([\\\"tinycloud-node\\\", \\\"tinycloud-ingress\\\"], label) { reason = \\\"unexpected_label\\\" }\\nelse if exists(.partial_message) { reason = \\\"partial\\\" }\\nelse if !is_string(raw) { reason = \\\"malformed_envelope\\\" }\\nelse if length(string!(raw)) > 65536 { reason = \\\"oversized\\\" }\\nif reason != \\\"\\\" {\\n  . = {\\\"reason\\\": reason}\\n} else {\\n  parsed, err = parse_json(string!(raw))\\n  if err != null || !is_object(parsed) { . = {\\\"reason\\\": \\\"non_json\\\"} }\\n  else if exists(parsed.partial_message) { . = {\\\"reason\\\": \\\"partial\\\"} }\\n  else {\\n    target = string(parsed.target) ?? \\\"\\\"\\n    level = downcase(string(parsed.level) ?? \\\"\\\")\\n    if label == \\\"tinycloud-node\\\" && !includes([\\\"warn\\\", \\\"error\\\"], level) && target != \\\"tinycloud\\\" && !starts_with(target, \\\"tinycloud::\\\") && target != \\\"tinycloud_core\\\" && !starts_with(target, \\\"tinycloud_core::\\\") {\\n      . = {\\\"reason\\\": \\\"unknown_target\\\"}\\n    } else if label == \\\"tinycloud-node\\\" && !includes([\\\"warn\\\", \\\"error\\\"], level) && !((target == \\\"tinycloud::request\\\" || target == \\\"tinycloud::disk_headroom\\\" || target == \\\"tinycloud_core::models::delegation_mode\\\") && level == \\\"info\\\") {\\n      . = {\\\"reason\\\": \\\"filtered_level\\\"}\\n    } else { . = {\\\"label\\\": label, \\\"parsed\\\": parsed} }\\n  }\\n}\\n}\",\"drop_on_error\":true,\"drop_on_abort\":true},\"gate_route\":{\"type\":\"route\",\"inputs\":[\"logship_gate\"],\"route\":{\"candidate\":\"exists(.parsed)\",\"rejected\":\"exists(.reason)\"}},\"allowlist\":{\"type\":\"remap\",\"inputs\":[\"gate_route.candidate\"],\"source\":\"# Only this fresh object can leave the process boundary. No envelope, span,\\n# message, error, identity, URI or unknown key is copied into it.\\nj = .parsed\\nlabel = .label\\nout = {}\\nts = \\\"\\\"\\nif label == \\\"tinycloud-node\\\" {\\n  target = string(j.target) ?? \\\"\\\"\\n  level = downcase(string!(j.level))\\n  f = object(j.fields) ?? {}\\n  msg = string(f.message) ?? \\\"\\\"\\n  ts = string!(j.timestamp)\\n  # Literal Rocket template aliases only; never split an arbitrary URI.\\n  aliases = {\\\"/attestation?<nonce>\\\":\\\"/attestation\\\",\\\"/.well-known/encryption/network/<name>?<query..>\\\":\\\"/.well-known/encryption/network/<name>\\\",\\\"/hooks/events?<ticket>\\\":\\\"/hooks/events\\\",\\\"/hooks/webhooks?<query..>\\\":\\\"/hooks/webhooks\\\",\\\"/public/<space_id>/kv?<prefix>\\\":\\\"/public/<space_id>/kv\\\"}\\n  # TC-1840: the node's one 5xx diagnostic line per database failure ships as an individual event.\\n  # The input must carry exactly the declared keys (the message plus these seven, and db_hash only\\n  # when it is a valid pseudonym) with exactly the declared types and enum values. Anything else\\n  # leaves db_event null and the line falls back to the unclassified count below; no value of it\\n  # is ever copied unless it passed, and the shipped object is built from literals and the\\n  # validated values only.\\n  db_event = null\\n  if target == \\\"tinycloud::request\\\" && level == \\\"warn\\\" && msg == \\\"database failure answered with a 5xx\\\" {\\n    db_status = f.status\\n    db_elapsed = f.elapsed_ms\\n    db_code = string(f.code) ?? \\\"\\\"\\n    db_service = string(f.service) ?? \\\"\\\"\\n    db_kind = string(f.failure_kind) ?? \\\"\\\"\\n    db_route = string(f.route) ?? \\\"\\\"\\n    db_canonical_route = get(aliases, [db_route]) ?? null\\n    if is_string(db_canonical_route) { db_route = db_canonical_route }\\n    db_ok = is_integer(db_status) && is_integer(db_elapsed) && is_boolean(f.write_may_have_applied)\\n    if db_ok {\\n      db_status = int!(db_status)\\n      db_elapsed = int!(db_elapsed)\\n      db_ok = db_status >= 500 && db_status <= 599 && db_elapsed >= 0 && db_elapsed <= 9007199254740991 && includes([\\\"unavailable_retryable\\\",\\\"outcome_unknown\\\",\\\"internal\\\",\\\"sql_busy\\\",\\\"request_timeout\\\",\\\"read_audit_busy\\\"], db_code) && includes([\\\"sql\\\",\\\"duckdb\\\",\\\"kv\\\",\\\"other\\\"], db_service) && includes([\\\"pool_timeout\\\",\\\"pool_closed\\\",\\\"io\\\",\\\"statement_timeout\\\",\\\"serialization\\\",\\\"connection_lost\\\",\\\"artifact_changed\\\",\\\"lock_wait\\\",\\\"hydration\\\",\\\"artifact_transfer\\\",\\\"request_timeout\\\",\\\"read_audit_busy\\\",\\\"other\\\"], db_kind) && includes([\\\"/healthz\\\",\\\"/info\\\",\\\"/version\\\",\\\"/invoke\\\",\\\"/delegate\\\",\\\"/revoke\\\",\\\"/attestation\\\",\\\"/signed/kv\\\",\\\"/signed/kv/<ticket_id>\\\",\\\"/admin/quota\\\",\\\"/admin/quota/<space_id>\\\",\\\"/admin/usage\\\",\\\"/admin/stats\\\",\\\"/hooks/events\\\",\\\"/hooks/tickets\\\",\\\"/hooks/webhooks\\\",\\\"/hooks/webhooks/<subscription_id>\\\",\\\"/delegation/query\\\",\\\"/delegation/status\\\",\\\"/encryption/networks\\\",\\\"/encryption/networks/<network_id>\\\",\\\"/encryption/networks/<network_id>/revoke\\\",\\\"/encryption/networks/<network_id>/decrypt\\\",\\\"/policy/v3/status\\\",\\\"/policy/v3/status/<root_cid>\\\",\\\"/policy/v3/policies\\\",\\\"/policy/v3/challenges\\\",\\\"/policy/v3/delegations\\\",\\\"/policy/v3/enforcer-bindings\\\",\\\"/policy/v3/deliveries/authorize\\\",\\\"/.well-known/tinycloud/node-keys\\\",\\\"/.well-known/encryption/network/<name>\\\",\\\"/public/<space_id>/kv\\\",\\\"/public/<space_id>/kv/<key..>\\\",\\\"/peer/generate/<space>\\\",\\\"/evidences/<file>\\\",\\\"/share/v2/readiness\\\",\\\"/share/v2/policies\\\",\\\"/share/v2/policy/challenges\\\",\\\"/share/v2/policy/session\\\",\\\"/share/v2/invoke\\\",\\\"/share/v2/deliveries/authorize\\\",\\\"/<_s..>\\\",\\\"/public/<_space_id>/kv/<_key..>\\\",\\\"<unmatched>\\\"], db_route)\\n    }\\n    db_hash = string(f.db_hash) ?? \\\"\\\"\\n    has_db_hash = exists(f.db_hash)\\n    if db_ok {\\n      if has_db_hash { db_ok = match(db_hash, r'^[0-9a-f]{64}$') && length(f) == 9 } else { db_ok = length(f) == 8 }\\n    }\\n    if db_ok {\\n      db_event = {\\\"event\\\": \\\"node_warning\\\", \\\"svc\\\": \\\"api\\\", \\\"level\\\": \\\"warn\\\", \\\"event_code\\\": \\\"db_failure_5xx\\\", \\\"status\\\": db_status, \\\"code\\\": db_code, \\\"service\\\": db_service, \\\"route\\\": db_route, \\\"elapsed_ms\\\": db_elapsed, \\\"failure_kind\\\": db_kind, \\\"write_may_have_applied\\\": bool!(f.write_may_have_applied)}\\n      if has_db_hash { db_event.db_hash = db_hash }\\n    }\\n  }\\n  # TC-2917: the node's periodic disk headroom line (one per local store) ships as an individual\\n  # info event. Exactly the message plus `store` (a declared store) and `free_bytes` (a bounded\\n  # integer in whole 64 MiB steps, as the node rounds it); anything else leaves headroom null, and\\n  # the info line is then dropped below.\\n  headroom = null\\n  if target == \\\"tinycloud::disk_headroom\\\" && level == \\\"info\\\" && msg == \\\"storage headroom\\\" && length(f) == 3 {\\n    h_store = string(f.store) ?? \\\"\\\"\\n    h_free = f.free_bytes\\n    if includes([\\\"sql\\\",\\\"duckdb\\\"], h_store) && is_integer(h_free) {\\n      h_free = int!(h_free)\\n      if h_free >= 0 && h_free <= 9007199254740991 && mod(h_free, 67108864) == 0 {\\n        headroom = {\\\"event\\\": \\\"node_storage_headroom\\\", \\\"svc\\\": \\\"api\\\", \\\"level\\\": \\\"info\\\", \\\"store\\\": h_store, \\\"free_bytes\\\": h_free}\\n      }\\n    }\\n  }\\n  # TC-3973: ship the boot summary with exactly the seven bounded counters.\\n  backfill = null\\n  if target == \\\"tinycloud_core::models::delegation_mode\\\" && level == \\\"info\\\" && length(f) == 8 {\\n    backfill_code = get({\\\"delegation mode boot reindex complete\\\":\\\"delegation_mode_boot_reindex_complete\\\",\\\"delegation mode boot reindex incomplete; skipped rows remain unmarked and derive on read\\\":\\\"delegation_mode_boot_reindex_incomplete\\\",\\\"delegation mode boot reindex incomplete (lock timeout); remaining rows derive on read\\\":\\\"delegation_mode_boot_reindex_lock_timeout\\\"}, [msg]) ?? null\\n    if is_string(backfill_code) {\\n      counters = {}\\n      for_each([\\\"scanned\\\", \\\"reindexed_terminal\\\", \\\"marked_attenuable\\\", \\\"marked_invalid\\\", \\\"skipped_locked_pages\\\", \\\"skipped_decrypt_failed\\\", \\\"elapsed_ms\\\"]) -> |_index, field| {\\n        value = int(get(f, [field]) ?? null) ?? -1\\n        if value >= 0 && value <= 9007199254740991 {\\n          counters = set!(counters, [field], value)\\n        }\\n      }\\n      if length(counters) == 7 {\\n        backfill = merge(counters, {\\\"e