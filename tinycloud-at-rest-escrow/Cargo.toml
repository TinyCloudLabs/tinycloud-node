[package]
name = "tinycloud-at-rest-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Escrow of the TinyCloud at-rest root key: 2-of-3 Shamir shares sealed to pinned age recipients (TC-887)"

[dependencies]
# Pinned exactly: share and bundle formats depend on these crates' behaviour.
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
vsss-rs = { version = "=5.4.0", default-features = false, features = ["std", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# A software P-256 identity that opens `p256tag` stanzas, so tests can
# round-trip shares sealed to hardware-key (`age1tag1…`) recipients.
age-core = "0.12"
hpke = { version = "0.12", default-features = false, features = ["alloc", "p256"] }
p256 = "0.13"
base64 = { workspace = true }
bech32 = "0.11"
