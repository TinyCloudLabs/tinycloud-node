[package]
name = "tinycloud-attestation"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE.md"
rust-version = "1.97.1"
description = "Offline DCAP and measured deployment policy verification"

[dependencies]
anyhow = "1.0"
dcap-qvl = { version = "=0.7.0", default-features = false, features = ["std", "ring", "default-x509"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
